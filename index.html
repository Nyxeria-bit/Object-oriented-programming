    { h: "The Rational class and class-design guidelines",
      p: ["Rational represents a fraction with a numerator and a denominator, reduced to its lowest terms, and supports add, subtract, multiply and divide as well as compareTo and toString. It is your slides' worked example of a well-designed class: immutable, self-validating and complete.",
          "The design guidelines that follow it are exam-ready material. Cohesion: a class should describe one thing; if it does two, split it. Consistency: follow naming conventions, provide a no-arg constructor where it makes sense, and place data fields before constructors and methods. Encapsulation: keep fields private and provide accessors only where they are needed. Clarity: methods should be independent of one another, and a class should not have too many parameters or surprising side effects. Completeness: provide the properties and methods most users will need.",
          "And on modifiers: a visibility modifier decides who can see a member, while [[static]] decides whether it belongs to the class or to each object. An instance method may call a static method, but a static method may not use instance members directly."] }
  ],
  summary: {
    points: ["An abstract method has no body; a class containing one must be abstract.",
      "You cannot instantiate an abstract class, but it has constructors and can be used as a type.",
      "An abstract class may have no abstract methods; its superclass may be concrete; a concrete method may be overridden as abstract.",
      "Interfaces hold [[public static final]] constants and [[public abstract]] methods; modifiers may be omitted.",
      "A class extends one class but implements many interfaces.",
      "[[Comparable]]: [[compareTo]] returns negative, 0 or positive, and makes [[Arrays.sort]] work.",
      "[[Cloneable]] is a marker interface; Object's clone is shallow, so clone mutable fields yourself for a deep copy.",
      "Strong is-a → class; weak is-a (is-kind-of, a capability) → interface.",
      "Design guidelines: cohesion, consistency, encapsulation, clarity, completeness."],
    syntax: [["Abstract class", "public abstract class Shape {\n    public abstract double getArea();\n}"], ["Interface", "public interface Edible {\n    String howToEat();\n}"], ["Implement both", "public class Chicken extends Animal implements Edible, Comparable<Chicken> { }"], ["compareTo", "public int compareTo(Student o) {\n    return Double.compare(gpa, o.gpa);\n}"], ["Deep copy", "House c = (House) super.clone();\nc.whenBuilt = (Date) whenBuilt.clone();"]],
    traps: ["[[new AbstractClass()]] — compile error, but a variable of that type is fine.", "Forgetting that an interface field is automatically a constant.", "Implementing Comparable but writing [[compare]] instead of [[compareTo]].", "Assuming clone gives independent copies of object fields.", "Trying to extend two classes."],
    exam: ["Say which of a set of statements about abstract classes are true.", "Choose between an abstract class and an interface for a described scenario and justify it.", "Write a class implementing Comparable and explain how Arrays.sort uses it.", "Explain shallow versus deep copy with an example.", "List and explain class-design guidelines."]
  }
};

NOTES.ch14 = {
  intro: "JavaFX is the toolkit for building graphical programs. This chapter is mostly structural: what a JavaFX program looks like, how nodes are arranged by panes, what shapes and colours are available, and how binding keeps the display in step with the data.",
  sections: [
    { h: "JavaFX versus Swing and AWT",
      p: ["AWT came first and used the operating system's own components, which behaved differently on each platform. Swing replaced it with lightweight components drawn by Java itself. JavaFX is the newer toolkit and the one your slides use: it is designed for modern displays, supports multi-touch and animation, and separates appearance (which can be styled with CSS) from behaviour."] },
    { h: "The basic structure of a JavaFX program",
      p: ["Every JavaFX program is a class that extends [[Application]] and overrides [[start(Stage primaryStage)]]. The [[main]] method calls [[launch(args)]], which starts the JavaFX runtime and then calls [[start]].",
          "The vocabulary: a Stage is a window (the one you are given is the primary stage). A Scene holds the content of a window. Nodes are everything you can put in a scene — panes, UI controls and shapes — arranged in a tree."],
      code: String.raw`import javafx.application.Application;
import javafx.scene.Scene;
import javafx.scene.control.Button;
import javafx.stage.Stage;

public class MyJavaFX extends Application {
    @Override
    public void start(Stage primaryStage) {
        Button btOK = new Button("OK");
        Scene scene = new Scene(btOK, 200, 250);
        primaryStage.setTitle("MyJavaFX");
        primaryStage.setScene(scene);
        primaryStage.show();
    }

    public static void main(String[] args) {
        launch(args);
    }
}`,
      note: "Stage → Scene → node tree. A node can appear in only one place in that tree." },
    { h: "Panes, UI controls and shapes",
      p: ["A Scene can hold only one root node, so that root is almost always a pane. Panes are containers: you add children with [[pane.getChildren().add(node)]] or [[addAll(...)]], and the pane decides where they go.",
          "Shapes are drawn using a coordinate system whose origin (0, 0) is the top-left corner, with x increasing to the right and y increasing downwards — the opposite of mathematics for y."],
      code: String.raw`Pane pane = new Pane();
Circle circle = new Circle();
circle.setCenterX(100);
circle.setCenterY(100);
circle.setRadius(50);
circle.setStroke(Color.BLACK);
circle.setFill(Color.WHITE);
pane.getChildren().add(circle);` },
    { h: "Property binding",
      p: ["Binding connects a target property to a source so that the target always follows the source. This removes the need to recompute positions by hand when a window is resized.",
          "For every property [[x]] there is a getter [[getX()]], a setter [[setX(v)]] and a property getter [[xProperty()]]. Only the property object can be bound. Binding is unidirectional with [[bind]] and two-way with [[bindBidirectional]], and a bound property cannot also be set directly."],
      code: String.raw`circle.centerXProperty().bind(pane.widthProperty().divide(2));
circle.centerYProperty().bind(pane.heightProperty().divide(2));
// the circle now stays centred when the window is resized` },
    { h: "Common node properties, Color and Font",
      p: ["Useful node members: [[setStyle]] for a CSS string, [[setRotate]] for rotation in degrees, and [[setOpacity]].",
          "Color has named constants ([[Color.RED]]) and two ways to build a colour: [[Color.rgb(r, g, b)]] with values from 0 to 255, and [[new Color(r, g, b, opacity)]] with values from 0.0 to 1.0.",
          "Font is created with [[Font.font(name, weight, posture, size)]], for example [[Font.font(\"Times New Roman\", FontWeight.BOLD, FontPosture.ITALIC, 20)]]."],
      code: String.raw`circle.setStyle("-fx-stroke: black; -fx-fill: red;");
text.setFont(Font.font("Times New Roman", FontWeight.BOLD, 20));
circle.setFill(Color.rgb(108, 76, 241));` },
    { h: "Image and ImageView",
      p: ["[[Image]] loads a picture from a file name or a URL; [[ImageView]] is the node that displays it. One Image can be shown by several ImageViews with different sizes or rotations."],
      code: String.raw`Image image = new Image("image/ghana.gif");
ImageView view = new ImageView(image);
view.setFitHeight(100);
view.setFitWidth(100);` },
    { h: "Layout panes",
      table: { head: ["Pane", "How it arranges children"], rows: [
        ["[[Pane]]", "no arrangement: you set the coordinates yourself"],
        ["[[StackPane]]", "stacks children in the centre, one on top of another"],
        ["[[FlowPane]]", "in rows or columns, wrapping when the space runs out"],
        ["[[GridPane]]", "in a grid; [[add(node, column, row)]]"],
        ["[[BorderPane]]", "five regions: top, bottom, left, right, center"],
        ["[[HBox]]", "one row"],
        ["[[VBox]]", "one column"]] },
      code: String.raw`GridPane pane = new GridPane();
pane.setAlignment(Pos.CENTER);
pane.setHgap(5);
pane.setVgap(5);
pane.add(new Label("First Name:"), 0, 0);
pane.add(new TextField(), 1, 0);

BorderPane border = new BorderPane();
border.setTop(new Label("Top"));
border.setCenter(new Label("Center"));` },
    { h: "Shape classes",
      p: ["[[Text]] draws a string at (x, y), where y is the baseline of the first line. [[Line]] takes a start and an end point. [[Rectangle]] takes x, y, width and height, and has [[arcWidth]] and [[arcHeight]] for rounded corners. [[Circle]] takes centre x, centre y and radius. [[Ellipse]] takes a centre plus radiusX and radiusY. [[Arc]] adds startAngle, length and a type ([[ArcType.ROUND]], [[OPEN]] or [[CHORD]]), with angles measured anticlockwise in degrees. [[Polygon]] and [[Polyline]] take a list of points; a polygon closes itself, a polyline does not."],
      code: String.raw`Text text = new Text(20, 20, "Programming is fun");
Line line = new Line(10, 10, 100, 100);
Rectangle r = new Rectangle(25, 10, 60, 30);
r.setArcWidth(15);
Arc arc = new Arc(100, 100, 80, 80, 30, 35);   // centre, radii, start, length
arc.setType(ArcType.ROUND);
Polygon polygon = new Polygon();
polygon.getPoints().addAll(40.0, 20.0, 70.0, 40.0, 60.0, 80.0);` },
    { h: "Case study: the ClockPane class",
      p: ["ClockPane is a reusable node: a class that extends Pane and draws a clock face with hour, minute and second hands from the current time. It keeps hour, minute and second as private fields with getters and setters, redrawing whenever they change, and it sizes itself from the pane's width and height.",
          "The lesson is the same as Chapter 10's: design a class with a clear contract, hide the drawing details, and then any program can put a clock in a window with two lines."] }
  ],
  summary: {
    points: ["Extend Application, override [[start(Stage)]], call [[launch(args)]] from main.",
      "Stage (window) → Scene → nodes; a Scene has one root, usually a pane.",
      "Origin (0, 0) is top-left; y increases downwards.",
      "Add children with [[pane.getChildren().add(...)]].",
      "Binding: [[target.xProperty().bind(source.yProperty())]]; bidirectional binding exists too.",
      "Panes: Pane, StackPane, FlowPane, GridPane, BorderPane (5 regions), HBox (row), VBox (column).",
      "Color.rgb uses 0–255; new Color uses 0.0–1.0.",
      "Shapes: Text, Line, Rectangle, Circle, Ellipse, Arc, Polygon, Polyline."],
    syntax: [["Skeleton", "public class X extends Application {\n    public void start(Stage s) { }\n    public static void main(String[] a) { launch(a); }\n}"], ["Scene", "Scene scene = new Scene(pane, 400, 300);\nstage.setScene(scene);\nstage.show();"], ["Binding", "circle.centerXProperty().bind(pane.widthProperty().divide(2));"], ["GridPane", "pane.add(node, column, row);"]],
    traps: ["Adding the same node to two panes.", "Forgetting [[primaryStage.show()]].", "Setting a property that is already bound.", "Expecting y to increase upwards."],
    exam: ["Name the containment order of Stage, Scene and nodes.", "Choose the right pane for a described layout.", "Write code to display given shapes at given positions.", "Explain what binding does and write one binding statement."]
  }
};

NOTES.ch15 = {
  intro: "Until now your programs ran from top to bottom. An event-driven program waits instead: the user clicks, types or moves the mouse, and the runtime calls the code you registered for that event. This chapter explains that model and then uses it for animations.",
  sections: [
    { h: "Procedural versus event-driven programming",
      p: ["In procedural code you decide the order of execution. In event-driven code the order is decided by the user. You write handlers and register them, then the JavaFX runtime calls them whenever the matching event occurs.",
          "The consequence: your code is made of small responses rather than one long sequence, and shared state lives in fields rather than in local variables."] },
    { h: "Events, event sources and event classes",
      p: ["An event is an object describing something that happened. The event source is the object on which it happened, usually a control such as a button.",
          "All event classes descend from [[java.util.EventObject]], through [[javafx.event.Event]]. The ones you use most are [[ActionEvent]] (a button pressed, Enter typed in a text field), [[MouseEvent]] (clicked, pressed, released, dragged, moved, entered, exited) and [[KeyEvent]] (pressed, released, typed).",
          "The event object carries information: [[getSource()]] tells you which object fired it; a MouseEvent gives [[getX()]], [[getY()]], [[getButton()]] and [[getClickCount()]]; a KeyEvent gives [[getCode()]] and [[getText()]]."],
      table: { head: ["User action", "Source", "Register with", "Event type"], rows: [
        ["Click a button", "Button", "[[setOnAction]]", "ActionEvent"],
        ["Press Enter in a text field", "TextField", "[[setOnAction]]", "ActionEvent"],
        ["Select a new item", "ComboBox / RadioButton", "[[setOnAction]]", "ActionEvent"],
        ["Press the mouse", "Node / Scene", "[[setOnMousePressed]]", "MouseEvent"],
        ["Drag the mouse", "Node / Scene", "[[setOnMouseDragged]]", "MouseEvent"],
        ["Press a key", "Node / Scene", "[[setOnKeyPressed]]", "KeyEvent"]] } },
    { h: "The delegation model",
      p: ["The source object does not decide what happens; it delegates to a handler object. You create a handler that implements [[EventHandler<T>]] and register it with the appropriate [[setOn...]] method. When the event fires, the runtime calls the handler's [[handle]] method and passes it the event object."],
      code: String.raw`class OKHandlerClass implements EventHandler<ActionEvent> {
    @Override
    public void handle(ActionEvent e) {
        System.out.println("OK button clicked");
    }
}

Button btOK = new Button("OK");
btOK.setOnAction(new OKHandlerClass());` },
    { h: "Inner classes and anonymous inner classes",
      p: ["A handler usually needs access to the variables of the class that created the GUI, so it is written as an inner class: a class declared inside another class. An inner class can use its outer class's private members, and it is compiled to a file named [[Outer$Inner.class]].",
          "If the handler is used only once, an anonymous inner class removes the name: you declare and create the class in the same expression."],
      code: String.raw`btEnlarge.setOnAction(new EventHandler<ActionEvent>() {
    @Override
    public void handle(ActionEvent e) {
        circlePane.enlarge();
    }
});` },
    { h: "Lambda expressions",
      p: ["A lambda is a shorter way of writing an object for an interface that has exactly one abstract method — a Single Abstract Method (SAM) interface. EventHandler qualifies, so any handler can be written as a lambda.",
          "The syntax is: parameters, then [[->]], then either an expression or a block. The parameter type is optional because the compiler can work it out."],
      code: String.raw`// all three are the same handler
btEnlarge.setOnAction(e -> circlePane.enlarge());
btEnlarge.setOnAction((e) -> circlePane.enlarge());
btEnlarge.setOnAction((ActionEvent e) -> { circlePane.enlarge(); });` },
    { h: "Mouse and key events",
      p: ["Mouse handlers receive the position in the node's coordinates, so dragging is a matter of setting the node's position to [[e.getX()]] and [[e.getY()]].",
          "Key events only reach a node that has the focus, so call [[requestFocus()]] on it, usually after the stage is shown. [[KeyCode]] constants name the keys: [[UP]], [[DOWN]], [[LEFT]], [[RIGHT]], [[ENTER]], [[ESCAPE]], and the letters and digits."],
      code: String.raw`text.setOnMouseDragged(e -> {
    text.setX(e.getX());
    text.setY(e.getY());
});

text.setOnKeyPressed(e -> {
    switch (e.getCode()) {
        case DOWN -> text.setY(text.getY() + 10);
        case UP -> text.setY(text.getY() - 10);
        case LEFT -> text.setX(text.getX() - 10);
        case RIGHT -> text.setX(text.getX() + 10);
        default -> {
            if (Character.isLetterOrDigit(e.getText().charAt(0)))
                text.setText(e.getText());
        }
    }
});
text.requestFocus();` },
    { h: "Listeners for observable objects",
      p: ["Every JavaFX property is an [[Observable]], so you can attach an [[InvalidationListener]] that runs whenever the value changes. This is how you react to a slider being moved or a window being resized, without any button being pressed."],
      code: String.raw`slider.valueProperty().addListener(ov ->
    label.setText("Value is " + slider.getValue()));` },
    { h: "Animation",
      p: ["The abstract [[Animation]] class provides the controls shared by all animations: [[play()]], [[pause()]], [[stop()]], [[setCycleCount(n)]] (or [[Timeline.INDEFINITE]]), [[setAutoReverse(true)]] and [[setRate]].",
          "[[PathTransition]] moves a node along a shape used as a path. [[FadeTransition]] changes opacity from one value to another. [[Timeline]] is the general one: it runs a KeyFrame handler repeatedly at a chosen interval, so you can update positions yourself."],
      code: String.raw`PathTransition pt = new PathTransition(Duration.millis(4000), new Circle(125, 100, 50), rectangle);
pt.setCycleCount(Timeline.INDEFINITE);
pt.play();

FadeTransition ft = new FadeTransition(Duration.millis(3000), ellipse);
ft.setFromValue(1.0);
ft.setToValue(0.1);
ft.setAutoReverse(true);
ft.play();

Timeline animation = new Timeline(
    new KeyFrame(Duration.millis(1000), e -> clock.setCurrentTime()));
animation.setCycleCount(Timeline.INDEFINITE);
animation.play();` },
    { h: "Case studies: the loan calculator and the bouncing ball",
      p: ["The loan calculator wires a GUI to a computation: text fields for the amount, rate and years, and a button whose handler reads the fields, builds a Loan object and displays the monthly and total payments in a label.",
          "The bouncing ball uses a Timeline that moves the ball a little on each frame and reverses its direction when it reaches an edge. Buttons and mouse or key handlers then pause, resume and change the speed, which shows how animation and event handling fit together."] }
  ],
  summary: {
    points: ["Event-driven: the user decides the order; you write handlers and register them.",
      "Delegation model: source object + registered handler; the runtime calls [[handle(event)]].",
      "ActionEvent for buttons and text fields; MouseEvent and KeyEvent for the mouse and keyboard.",
      "Handlers can be inner classes, anonymous inner classes or lambdas; lambdas work because EventHandler is a SAM interface.",
      "Key events need [[requestFocus()]] on the node.",
      "Listeners on properties react to any value change.",
      "Animation: PathTransition (move along a path), FadeTransition (opacity), Timeline (repeat a KeyFrame); control with play, pause, setCycleCount, setAutoReverse."],
    syntax: [["Lambda handler", "btOK.setOnAction(e -> label.setText(\"Clicked\"));"], ["Mouse", "node.setOnMouseDragged(e -> {\n    node.setX(e.getX());\n});"], ["Key", "node.setOnKeyPressed(e -> { ... });\nnode.requestFocus();"], ["Listener", "slider.valueProperty().addListener(ov -> { ... });"], ["Timeline", "Timeline t = new Timeline(new KeyFrame(Duration.millis(50), e -> move()));\nt.setCycleCount(Timeline.INDEFINITE);\nt.play();"]],
    traps: ["Registering the handler on the wrong object.", "Forgetting requestFocus() and wondering why keys do nothing.", "Using a lambda for an interface with more than one abstract method.", "Forgetting [[play()]], or that an INDEFINITE animation never stops by itself."],
    exam: ["Explain the delegation model with a button example.", "Rewrite an anonymous inner-class handler as a lambda.", "Say why a key handler does not fire and how to fix it.", "Choose the right animation class for a described effect."]
  }
};

NOTES.ch16 = {
  intro: "This chapter is a catalogue: the controls you actually put in a window, what each one is for, and how to read its value. Learn the hierarchy at the top, then the pattern for each control — create it, configure it, register a handler, read its value.",
  sections: [
    { h: "The Labeled hierarchy",
      p: ["[[Labeled]] is the abstract superclass of controls that display text with an optional graphic. It provides [[text]], [[graphic]], [[contentDisplay]] (where the graphic sits: TOP, BOTTOM, LEFT, RIGHT, CENTER), [[textFill]], [[alignment]] and [[wrapText]].",
          "[[Label]] displays a short piece of text and is not interactive. [[ButtonBase]] extends Labeled and adds the [[onAction]] property; [[Button]], [[CheckBox]], [[RadioButton]] and [[ToggleButton]] all descend from it, which is why they share so many methods."],
      code: String.raw`Label label = new Label("Choose a colour");
label.setGraphic(new ImageView(image));
label.setContentDisplay(ContentDisplay.LEFT);` },
    { h: "Button",
      code: String.raw`Button btLeft = new Button("<=", new ImageView(leftImage));
btLeft.setOnAction(e -> text.setX(text.getX() - 10));`,
      p: ["A Button fires an ActionEvent when it is clicked. Everything else about it — text, graphic, alignment — comes from Labeled."] },
    { h: "CheckBox and RadioButton",
      p: ["A CheckBox is independent: each one is either selected or not, and you read it with [[isSelected()]]. Several check boxes may be selected at once.",
          "A RadioButton looks similar but is meant to be exclusive. Exclusivity comes from adding the buttons to a [[ToggleGroup]]: only one member can be selected at a time."],
      code: String.raw`CheckBox chkBold = new CheckBox("Bold");
chkBold.setOnAction(e -> {
    if (chkBold.isSelected()) { ... }
});

RadioButton rbRed = new RadioButton("Red");
RadioButton rbGreen = new RadioButton("Green");
ToggleGroup group = new ToggleGroup();
rbRed.setToggleGroup(group);
rbGreen.setToggleGroup(group);
rbRed.setOnAction(e -> { if (rbRed.isSelected()) text.setFill(Color.RED); });` },
    { h: "TextField, PasswordField and TextArea",
      p: ["[[TextField]] accepts one line. Read it with [[getText()]], change it with [[setText(s)]], and set its width in characters with [[setPrefColumnCount]]. Pressing Enter in a text field fires an ActionEvent.",

          "[[TextArea]] accepts several lines and adds [[setPrefRowCount]], [[setWrapText(true)]] and [[appendText]]. Put it in a [[ScrollPane]] when the text may be long."],
      code: String.raw`TextField tfName = new TextField();
tfName.setOnAction(e -> System.out.println("Hello " + tfName.getText()));

TextArea taNote = new TextArea();
taNote.setWrapText(true);
taNote.setPrefRowCount(5);` },
    { h: "ComboBox and ListView",
      p: ["A [[ComboBox]] is a drop-down list for choosing one value. Fill it with [[getItems().addAll(...)]], read the choice with [[getValue()]], and react with [[setOnAction]].",
          "A [[ListView]] shows several items at once. It is filled from an observable list, and the selection is handled by its selection model: [[getSelectionModel().setSelectionMode(SelectionMode.MULTIPLE)]] allows several, and [[getSelectedItems()]] or [[getSelectedIndices()]] tells you what was chosen."],
      code: String.raw`ComboBox<String> cbo = new ComboBox<>();

cbo.setValue("Accra");
cbo.setOnAction(e -> System.out.println(cbo.getValue()));

ListView<String> lv = new ListView<>(FXCollections.observableArrayList("Java", "Python", "C++"));
lv.getSelectionModel().setSelectionMode(SelectionMode.MULTIPLE);
lv.getSelectionModel().selectedItemProperty().addListener(ov -> { ... });` },
    { h: "ScrollBar and Slider",
      p: ["Both let the user choose a value from a range, and both have [[min]], [[max]], [[value]] and [[orientation]]. A ScrollBar adds [[visibleAmount]], [[unitIncrement]] and [[blockIncrement]]; a Slider adds tick marks and labels ([[setShowTickLabels]], [[setShowTickMarks]], [[setMajorTickUnit]]).",

      code: String.raw`Slider slider = new Slider(0, 100, 50);

NOTES.trace = {
  intro: "Your teaching guide on trace tables is a study skill rather than a chapter of Java, and it is the single most useful exam technique in this course. A trace table is a written record of how the values in a program change as it runs, and it turns “what does this print?” from a guess into a procedure.",
  sections: [
    { h: "What a trace table is and why it works",
      p: ["A trace table has one column per variable, plus columns for any condition you want to watch and for output. Each row records the state after something changes, so moving down the table is moving forward in time.",
          "It works because it removes memory from the problem. Instead of holding five variables in your head, you write them down and update one at a time. It also finds logic errors that the compiler cannot see, which is the whole point of desk checking."] },
    { h: "The rules",
      p: ["Write a new row whenever a value changes; do not overwrite an old value, because the history is what you are checking.",
          "Include the loop condition in a column and record whether it was true or false, so you can explain why the loop stopped.",
          "For a for loop, follow the exact order: initialise, test, body, update, test, body, update… The counter's final value is the one that failed the test.",
          "In nested loops, the inner counter is reinitialised on every pass of the outer loop.",
          "For objects, keep the variables and the objects separate: two variables may refer to one object, so a change through one is visible through the other."] },
    { h: "Worked example: a while loop",
      code: String.raw`int x = 3;
int y = 1;
while (x > 0) {
    y = y * 2;
    x = x - 1;
}
System.out.println(y);`,
      table: { head: ["Step", "x", "y", "x > 0", "Output"], rows: [["Start", "3", "1", "true", ""], ["After pass 1", "2", "2", "true", ""], ["After pass 2", "1", "4", "true", ""], ["After pass 3", "0", "8", "false", ""], ["After the loop", "0", "8", "", "8"]] } },
    { h: "Worked example: a linear search",
      code: String.raw`int[] list = {4, 9, 2, 7};
int key = 2;
int index = -1;
for (int i = 0; i < list.length; i++) {
    if (list[i] == key) {
        index = i;
        break;
    }
}`,
      table: { head: ["i", "list[i]", "list[i] == key", "index"], rows: [["0", "4", "false", "−1"], ["1", "9", "false", "−1"], ["2", "2", "true", "2 (then break)"]] },
      p: ["Adding a column for the element being compared is what makes a search trace readable, and it shows exactly how many comparisons were needed."] },
    { h: "Tracing objects and constructors",
      p: ["For object questions, draw two areas: the variables (the stack) and the objects (the heap). An arrow from a variable to an object records a reference, and a second arrow to the same object records aliasing.",
          "For constructor questions, first write the chain of calls upwards ([[Faculty() → Employee() → Person() → Object()]]), then read the print statements downwards, because bodies finish in reverse order."] },
    { h: "Common mistakes",
      p: ["Updating variables in the wrong order, for example applying the loop update before the body.",
          "Forgetting the final condition check that ends the loop, and so being unable to state the counter's final value.",
          "Off-by-one errors caused by reading [[<]] as [[<=]].",
          "Forgetting that the inner loop counter resets.",
          "Trusting memory instead of writing a row. If you find yourself saying “it should be…”, write the row."] },
    { h: "Checking yourself",
      p: ["Add a print statement inside the loop and compare with your table: [[System.out.println(\"x=\" + x + \" y=\" + y);]] produces the same rows the computer sees. Your teaching guide also suggests starting with block-based tools such as micro:bit, and logging values in Python, before doing it in Java."] }
  ],
  summary: {
    points: ["One column per variable, plus condition and output columns; one row per change.",
      "for loop order: initialise → test → body → update → test…",
      "The counter's final value is the one that failed the test.",
      "Inner loop counters reset on every outer pass.",
      "Trace objects as variables plus a separate heap, with arrows for references.",
      "Constructor chains: calls go up, bodies finish downwards."],
    syntax: [["Check a trace with prints", "System.out.println(\"i=\" + i + \" sum=\" + sum);"], ["Typical table", "Step | i | sum | i <= n | Output"]],
    traps: ["Skipping the row where the loop condition becomes false.", "Overwriting values instead of adding rows.", "Assuming an inner loop continues from where it stopped."],
    exam: ["Complete a partly filled trace table.", "State the output of a loop or nested loop.", "Say how many times a body executes.", "Explain, using your table, why a program produces a wrong answer."]
  }
};

const KEY = "objectlab-v1";
function defaults() {
  return { xp: 0, read: {}, best: {}, mistakes: {}, known: {}, games: {}, days: [], last: null, theme: null, lessonTab: "notes",

  try { return Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch (e) { return defaults(); }
})();

function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function touchDay() {
  const t = today();
  if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-120); save(); }
}
function streak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  while (true) {
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    if (set.has(k)) { n++; d.setDate(d.getDate() - 1); } else break;
  }
  return n;
}
function level() { return Math.floor(S.xp / 200) + 1; }

  S.xp += n; touchDay(); save(); updateSide();

/* ================= HELPERS ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fmt(s) { return esc(s).replace(/\[\[(.+?)\]\]/g, "<code>$1</code>"); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const PARTMAP = Object.fromEntries(PARTS.map(p => [p.id, p]));
const MODMAP = Object.fromEntries(MODULES.map(m => [m.id, m]));
function colorOf(m) { return "c-" + PARTMAP[m.part].color; }
function chLabel(m) { return m.num === "T" ? "Trace tables" : "Chapter " + m.num; }

const KW = new Set("abstract boolean break byte case catch char class continue default do double else enum extends final finally float for if implements import instanceof int interface long new null package private protected public record return short static super switch this throw throws true false try void while var yield".split(" "));
function hl(src) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(@\w+)|\b([A-Za-z_]\w*)\b|\b(\d+(?:\.\d+)?[dDfFL]?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += '<span class="t-com">' + t + "</span>";
    else if (m[2]) out += '<span class="t-str">' + t + "</span>";
    else if (m[3]) out += '<span class="t-ann">' + t + "</span>";
    else if (m[4]) out += KW.has(m[4]) ? '<span class="t-kw">' + t + "</span>" : (/^[A-Z]/.test(m[4]) ? '<span class="t-type">' + t + "</span>" : t);
    else if (m[5]) out += '<span class="t-num">' + t + "</span>";
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeBlock(src) { return '<pre class="code" tabindex="0"><code>' + hl(src) + "</code></pre>"; }

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function currentTheme() {
  if (S.theme) return S.theme;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme() { if (S.theme) document.documentElement.setAttribute("data-theme", S.theme); }
function toggleTheme() {
  S.theme = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", S.theme); save();
}
function updateSide() {
  if (!$("#xp")) return;

}

/* ================= QUIZ ENGINE ================= */
function runQuiz(el, items, opt = {}) {
  let i = 0, score = 0;
  const order = opt.keepOrder ? items.slice() : shuffle(items.slice());
  const xp = opt.xp == null ? 10 : opt.xp;
  function show() {
    if (i >= order.length) return finish();
    const it = order[i];
    const idx = it.o.map((_, k) => k);
    if (!it.fixed) shuffle(idx);
    const cls = it.o.length === 2 ? "two" : it.o.length === 3 ? "three" : "";
    el.innerHTML = `
      <div class="qhead"><span>${opt.label ? esc(opt.label) + " · " : ""}${i + 1} of ${order.length}</span><div class="bar"><i style="width:${(i / order.length) * 100}%"></i></div><span>${score} correct</span></div>
      ${it.pair ? `<div class="pair"><span class="cls">${esc(it.pair[0])}</span><span class="rel">?</span><span class="cls">${esc(it.pair[1])}</span></div>` : ""}
      <h2 class="qtext">${fmt(it.q)}</h2>
      ${it.code ? codeBlock(it.code) : ""}
      <div class="opts ${cls}">${idx.map((k, n) => `<button class="opt" data-k="${k}"><span class="key">${n + 1}</span><span>${fmt(it.o[k])}</span></button>`).join("")}</div>
      <div class="fb" aria-live="polite"></div>
      <p class="kbd-hint">Tip: press <kbd>1</kbd>–<kbd>${idx.length}</kbd> to answer and <kbd>Enter</kbd> for the next question.</p>`;
    const btns = $$(".opt", el);
    btns.forEach(b => b.onclick = () => answer(+b.dataset.k));
    keyHandler = e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= btns.length && !btns[0].disabled) { e.preventDefault(); btns[n - 1].click(); }
    };
    btns[0].focus({ preventScroll: true });
  }
  function answer(k) {
    const it = order[i];
    const ok = k === it.a;
    $$(".opt", el).forEach(b => {
      b.disabled = true;
      const bk = +b.dataset.k;
      if (bk === it.a) b.classList.add("right");
      else if (bk === k) b.classList.add("wrong");
    });
    if (ok) { score++; if (xp) addXP(xp); if (it.qid && S.mistakes[it.qid]) { delete S.mistakes[it.qid]; save(); } }
    else if (it.qid) { S.mistakes[it.qid] = Date.now(); save(); updateSide(); }
    if (it.qid) track(it.sk, modeOf(it), ok, { qid: it.qid, confuse: it.confuse });
    const last = i === order.length - 1;
    $(".fb", el).innerHTML = `
      <div class="verdict ${ok ? "ok" : "no"}">${ok ? pick(["Correct.", "Nice, that's right.", "Yes, exactly."]) : "Not quite. The right answer is highlighted."}</div>
      <div class="explain">${fmt(it.e)}${!ok && it.tempt ? `<p class="tempt"><b>Why the tempting answer looks right:</b> ${fmt(it.tempt)}</p>` : ""}</div>
      ${!ok ? reasonChips(it) : ""}
      <button class="btn" id="nextQ">${last && !opt.onDone ? "See results" : opt.onDone ? "Next" : "Next question"}</button>`;
    const nb = $("#nextQ", el);
    nb.onclick = () => { i++; show(); };
    nb.focus({ preventScroll: true });
    keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); nb.click(); } };
    $(".qhead span:last-child", el).textContent = score + " correct";
  }
  function finish() {
    keyHandler = null;
    if (opt.onDone) return opt.onDone(score, order.length);
    if (opt.onFinish) opt.onFinish(score, order.length);
    const pct = Math.round((score / order.length) * 100);
    el.innerHTML = `<div class="result panel">
      <div class="score">${score}/${order.length}</div>
      <h2 style="margin-top:12px">${pct === 100 ? "Perfect score." : pct >= 70 ? "Solid work." : pct >= 40 ? "Getting there." : "Worth another go."}</h2>
      <p class="muted">${score < order.length ? "Questions you missed were added to Mistakes so you can practise them again." : "Nothing new to review from this round."}</p>
      <div class="actions"><button class="btn" id="again">Try again</button>${opt.extra || ""}</div>
    </div>`;
    $("#again", el).onclick = () => { i = 0; score = 0; shuffleIf(); show(); };
  }
  function shuffleIf() { if (!opt.keepOrder) shuffle(order); }
  show();
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function viewQuiz(app, id) {
  const m = MODMAP[id]; if (!m) return viewLearn(app);
  const i = MODULES.indexOf(m), next = MODULES[i + 1];

    <div class="pagehead"><h1>${esc(m.title)} quiz</h1></div><div class="quizbox" id="qz"></div>`;

function gameTrace(app, g) {
  const el = gameHeader(app, g, "Run the code in your head and fill every cell. Cells turn green or red when you check.");
  let cur = 0;
  function draw() {
    const p = TRACE_GAME[cur];
    el.innerHTML = `
      <div class="tabs" role="group" aria-label="Choose a problem">${TRACE_GAME.map((t, i) => `<button class="tab" aria-pressed="${i === cur}" data-i="${i}">${i + 1}. ${esc(t.title)}</button>`).join("")}</div>

        <div>${codeBlock(p.code)}<p class="muted">${esc(p.note)}</p></div>
        <div class="panel">
          <div class="scroll-x"><table class="tt"><thead><tr><th>Row</th>${p.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
          <tbody>${p.rows.map((r, ri) => `<tr><td>${ri + 1}</td>${r.map((_, ci) => `<td><input class="trace-in" data-r="${ri}" data-c="${ci}" inputmode="numeric" aria-label="Row ${ri + 1}, ${esc(p.cols[ci])}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
          <div class="lesson-actions" style="margin-top:12px">

          </div>
          <div id="tfb" aria-live="polite" style="margin-top:12px"></div>
        </div>
      </div>`;
    $$(".tab", el).forEach(b => b.onclick = () => { cur = +b.dataset.i; draw(); });
    let revealed = false;
    $("#chk").onclick = () => {
      let right = 0, total = 0;
      $$(".trace-in", el).forEach(inp => {
        total++;
        const want = p.rows[+inp.dataset.r][+inp.dataset.c];
        const ok = inp.value.trim().toLowerCase() === want.toLowerCase();
        inp.classList.toggle("good", ok); inp.classList.toggle("badv", !ok);
        if (ok) right++;
      });
      if (right === total) {
        $("#tfb").innerHTML = `<p class="verdict" style="color:var(--ok);font-weight:700">Every cell is correct.</p>`;
        const k = "trace-" + cur;
        if (!revealed && !S.games[k]) { S.games[k] = 1; save(); addXP(30, "Trace table solved"); }
        const solved = TRACE_GAME.filter((_, i) => S.games["trace-" + i]).length;
        S.games.trace = solved + "/" + TRACE_GAME.length + " solved"; save();
      } else {
        $("#tfb").innerHTML = `<p>${right} of ${total} cells correct. Fix the red cells: check the order the statements run in, and whether the condition is tested before or after the body.</p>`;
      }
    };

    };
  }
  draw();
}

function gameMemory(app, g) {
  const el = gameHeader(app, g, "Find all six pairs. A term tile matches the tile with its definition.");
  let chosenMod = "all";
  function start() {
    const pool = chosenMod === "all" ? ALL_TERMS : ALL_TERMS.filter(t => t.mod === chosenMod);
    const pairs = shuffle(pool.slice()).slice(0, 6);
    const tiles = shuffle(pairs.flatMap((p, i) => [{ pid: i, kind: "term", text: p.t }, { pid: i, kind: "def", text: p.d }]));
    let open = [], matched = 0, moves = 0, lock = false; const t0 = Date.now();
    el.innerHTML = `
      <div class="mem-top">
        <label>Terms from <select id="memMod" style="font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">
          <option value="all">All chapters</option>${MODULES.map(m => `<option value="${m.id}" ${chosenMod === m.id ? "selected" : ""}>${chLabel(m)}</option>`).join("")}
        </select></label>
        <span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/${pairs.length}</span>
        <button class="btn small ghost" id="restart">New board</button>
      </div>
      <div class="mem-grid">${tiles.map((t, i) => `<button class="tile ${t.kind}" data-i="${i}" aria-label="Hidden tile ${i + 1}"><span class="back" aria-hidden="true">?</span><span class="face">${esc(t.text)}</span></button>`).join("")}</div>
      <div id="memfb" aria-live="polite" style="margin-top:16px"></div>`;
    if (chosenMod === "all") $("#memMod").value = "all";
    $("#memMod").onchange = e => { chosenMod = e.target.value; start(); };
    $("#restart").onclick = start;
    $$(".tile", el).forEach(b => b.onclick = () => {
      if (lock || b.classList.contains("open") || b.classList.contains("matched")) return;
      b.classList.add("open"); b.setAttribute("aria-label", tiles[+b.dataset.i].text);
      open.push(b);
      if (open.length === 2) {
        moves++; $("#moves").textContent = moves;
        const [a, c] = open.map(x => tiles[+x.dataset.i]);
        if (a.pid === c.pid && a.kind !== c.kind) {
          open.forEach(x => { x.classList.remove("open"); x.classList.add("matched"); });
          open = []; matched++; $("#pairs").textContent = matched; addXP(3);
          if (matched === pairs.length) {
            const secs = Math.round((Date.now() - t0) / 1000);
            const nb = setBest("memory-moves", moves, false);
            S.games.memory = S.games["memory-moves"] + " moves"; save();
            $("#memfb").innerHTML = `<div class="panel"><h3>Board cleared in ${moves} moves and ${secs} seconds.</h3><p class="muted">${nb ? "That's your best so far." : "Your best is " + S.games["memory-moves"] + " moves."}</p><button class="btn" id="again2">Play again</button></div>`;
            $("#again2").onclick = start;
          }
        } else {
          lock = true;
          open.forEach(x => x.classList.add("miss"));
          setTimeout(() => { open.forEach(x => { x.classList.remove("open", "miss"); x.setAttribute("aria-label", "Hidden tile"); }); open = []; lock = false; }, 1000);
        }
      }
    });
  }
  start();
}

function gameSpeed(app, g) {
  const el = gameHeader(app, g, "Mixed questions from every chapter. You have 60 seconds. Wrong answers are saved to Mistakes.");
  el.className = "quizbox";
  let timer = null;
  function intro() {
    el.innerHTML = `<div class="panel result"><div class="score" style="color:var(--coral)">60s</div><p class="muted" style="margin-top:12px">${S.games.speed != null ? "Your best: " + S.games.speed + " correct." : "Set your first score."}</p><div class="actions"><button class="btn" id="go">Start sprint</button></div></div>`;
    $("#go").onclick = play; $("#go").focus();
  }
  function play() {
    const pool = shuffle(Object.values(QBANK).filter(q => q.qid.startsWith("ch") || q.qid.startsWith("trace") || q.qid.startsWith("out")));
    let t = 60, score = 0, seen = 0, qi = 0;
    function draw() {
      const it = pool[qi % pool.length];
      const idx = shuffle(it.o.map((_, k) => k));
      el.innerHTML = `<div class="speed-top"><span class="sc">${score} correct · ${seen} answered</span><span class="timer" id="tm">${t}</span></div>
        <div class="bar" style="margin-bottom:18px"><i id="tbar" style="width:${(t / 60) * 100}%;background:var(--coral)"></i></div>
        <h2 class="qtext">${fmt(it.q)}</h2>${it.code ? codeBlock(it.code) : ""}
        <div class="opts">${idx.map((k, n) => `<button class="opt" data-k="${k}"><span class="key">${n + 1}</span><span>${fmt(it.o[k])}</span></button>`).join("")}</div>`;
      const btns = $$(".opt", el);
      btns.forEach(b => b.onclick = () => {
        const k = +b.dataset.k; seen++;
        btns.forEach(x => { x.disabled = true; if (+x.dataset.k === it.a) x.classList.add("right"); else if (+x.dataset.k === k) x.classList.add("wrong"); });
        track(it.sk, modeOf(it), k === it.a, { qid: it.qid });
        if (k === it.a) { score++; addXP(2); if (S.mistakes[it.qid]) { delete S.mistakes[it.qid]; save(); } }
        else { S.mistakes[it.qid] = Date.now(); save(); updateSide(); }
        qi++;
        setTimeout(() => { if (t > 0) draw(); }, k === it.a ? 350 : 900);
      });
      keyHandler = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= btns.length && !btns[0].disabled) btns[n - 1].click(); };
    }
    draw();
    timer = setInterval(() => {
      t--;
      const tm = $("#tm"), tb = $("#tbar");
      if (tm) tm.textContent = t;
      if (tb) tb.style.width = (t / 60) * 100 + "%";
      if (t <= 0) { clearInterval(timer); timer = null; end(score, seen); }
    }, 1000);
  }
  function end(score, seen) {
    keyHandler = null;
    const nb = setBest("speed", score);
    el.innerHTML = `<div class="panel result"><div class="score" style="color:var(--coral)">${score}</div>
      <h2 style="margin-top:12px">${nb ? "New personal best." : "Time's up."}</h2>
      <p class="muted">${score} correct out of ${seen} answered. Best: ${S.games.speed}.</p>
      <div class="actions"><button class="btn" id="go2">Sprint again</button><a class="btn ghost" href="#/review">Review mistakes</a></div></div>`;
    $("#go2").onclick = play;
  }
  cleanup = () => { if (timer) clearInterval(timer); };
  intro();
}

function viewCards(app, arg) {
  let filter = arg && MODMAP[arg] ? arg : "all";
  app.innerHTML = `<div class="pagehead"><h1>Flashcards</h1><p>Tap the card to flip it. Mark cards you know so the rest come back first.</p></div>
    <div class="tabs" id="fcTabs" role="group" aria-label="Filter by chapter"></div><div class="fc-area" id="fc"></div>`;
  function tabs() {
    $("#fcTabs").innerHTML = `<button class="tab" data-f="all" aria-pressed="${filter === "all"}">All</button>` +
      MODULES.map(m => `<button class="tab" data-f="${m.id}" aria-pressed="${filter === m.id}">${m.num === "T" ? "Trace" : "Ch " + m.num}</button>`).join("");
    $$("#fcTabs .tab").forEach(b => b.onclick = () => { filter = b.dataset.f; tabs(); deck(); });
  }
  let queue = [], pos = 0;
  function deck() {
    const cards = ALL_TERMS.filter(t => filter === "all" || t.mod === filter);
    const unknown = shuffle(cards.filter(c => !S.known[c.id]));
    const known = shuffle(cards.filter(c => S.known[c.id]));
    queue = unknown.concat(known); pos = 0; draw();
  }
  function draw() {
    const cards = ALL_TERMS.filter(t => filter === "all" || t.mod === filter);
    const knownCount = cards.filter(c => S.known[c.id]).length;
    const c = queue[pos % queue.length];
    const m = MODMAP[c.mod];
    $("#fc").innerHTML = `
      <div class="qhead"><span>Card ${(pos % queue.length) + 1} of ${queue.length}</span><div class="bar"><i style="width:${(knownCount / cards.length) * 100}%;background:var(--ok)"></i></div><span>${knownCount} known</span></div>
      <div class="flash" id="flash" role="button" tabindex="0" aria-label="Flashcard. Press space to flip.">
        <div class="flash-inner">
          <div class="flash-side flash-front"><span class="t">${esc(c.t)}</span><small>${chLabel(m)} · tap to flip</small></div>
          <div class="flash-side flash-back"><span>${esc(c.d)}</span><small class="muted">${esc(c.t)}</small></div>
        </div>
      </div>
      <div class="fc-actions">
        <button class="btn again" id="again">Show again later</button>
        <button class="btn got" id="got">I know this</button>
      </div>
      <div class="fc-actions" style="margin-top:12px">
        <button class="btn small ghost" id="shuf">Shuffle</button>
        <button class="btn small ghost" id="resetKnown">Reset known cards</button>
      </div>`;
    const f = $("#flash");
    const flip = () => f.classList.toggle("flipped");
    f.onclick = flip;
    f.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
    $("#again").onclick = () => { if (S.known[c.id]) { delete S.known[c.id]; save(); } queue.push(queue.splice(pos % queue.length, 1)[0]); draw(); };
    $("#got").onclick = () => { if (!S.known[c.id]) { S.known[c.id] = 1; save(); addXP(2); } pos++; draw(); };
    $("#shuf").onclick = deck;
    $("#resetKnown").onclick = () => { cards.forEach(x => delete S.known[x.id]); save(); deck(); };
    keyHandler = e => { if (e.key === "ArrowRight") $("#got").click(); if (e.key === "ArrowLeft") $("#again").click(); };
  }
  tabs(); deck();
}

/* ================= TRACKING, MASTERY, SPACED REPETITION ================= */
const DAY = 864e5;
function dayStart(t = Date.now()) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function pct(arr) { return arr && arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 100) : null; }
function ev(key, n = 1) { S.ev[key] = (S.ev[key] || 0) + n; }
function markDone(key) { if (!S.done[key]) { S.done[key] = Date.now(); } save(); }
function skillName(id) { const s = SKILLS.find(x => x.id === id); return s ? s.name : id; }

function track(skills, mode, ok, opts = {}) {
  (skills || []).forEach(k => {
    const r = S.skill[k] || (S.skill[k] = []); r.push(ok ? 1 : 0); if (r.length > 20) r.shift();
    adapt(k, ok);
  });
  if (mode) { const r = S.mode[mode] || (S.mode[mode] = []); r.push(ok ? 1 : 0); if (r.length > 30) r.shift(); }
  if (opts.confuse && !ok) S.confuse[opts.confuse] = (S.confuse[opts.confuse] || 0) + 1;
  if (opts.qid) srsUpdate(opts.qid, ok);
  touchDay(); save();
}
function adapt(k, ok) {
  const st = S.adapt[k] || (S.adapt[k] = { level: 1, run: 0 });
  if (ok) { st.run = st.run > 0 ? st.run + 1 : 1; if (st.run >= 3) { st.level = Math.min(8, st.level + 1); st.run = 0; } }
  else { st.run = st.run < 0 ? st.run - 1 : -1; if (st.run <= -2) { st.level = Math.max(1, st.level - 1); st.run = 0; st.stepBack = Date.now(); } }
}
const SRS_INT = [0, 1, 3, 7, 14];
function srsUpdate(qid, ok) {
  let r = S.srs[qid];
  if (!r) { if (ok) return; r = S.srs[qid] = { box: 0 }; }
  if (ok) { if (r.box >= 4) { delete S.srs[qid]; return; } r.box++; }
  else r.box = 0;
  r.due = dayStart() + SRS_INT[r.box] * DAY;
}
function srsDue() { const now = Date.now(); return Object.keys(S.srs).filter(k => S.srs[k].due <= now); }

/* SAMPLE (Claude) capability: only inside Claude */
let SAMPLE = null;
(async () => {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      SAMPLE = await window.claude.use("sample");
      if (SAMPLE) { document.documentElement.classList.add("has-ai"); document.dispatchEvent(new Event("sample-ready")); }

async function askClaude(prompt, outEl, opts = {}) {
  if (!SAMPLE) { outEl.textContent = "Claude feedback is only available when you open this site inside Claude."; return null; }
  outEl.textContent = "Thinking…";
  try {
    const { text } = await SAMPLE(prompt, { onText: ({ text }) => { outEl.innerHTML = mdLite(text); }, modelTier: opts.tier || "default", cache: false });
    outEl.innerHTML = mdLite(text);

  } catch (e) {
    const msg = { not_granted: "Claude feedback was not allowed for this page.", rate_limited: "Too many requests right now. Try again in a minute." }[e.code] || "Claude could not answer just now.";
    outEl.innerHTML = (e.text ? mdLite(e.text) : "") + `<p class="muted">${msg}</p>`;
    return null;
  }
}
function mdLite(t) {
  let h = esc(t);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => '<pre class="code"><code>' + c + "</code></pre>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return h.split(/\n{2,}/).map(p => p.startsWith("<pre") ? p : "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
}

/* ================= UML RENDERER ================= */
function umlSvg(model) {
  const classes = model.classes || [], links = model.links || [];
  if (!classes.length) return `<p class="muted">Add classes to see the diagram.</p>`;
  const cw = 7.4, lh = 17, pad = 10;
  const depth = {};
  const parentOf = n => links.filter(l => l[0] === n && (l[2] === "extends" || l[2] === "implements")).map(l => l[1]);
  const d = (n, seen = new Set()) => { if (seen.has(n)) return 0; seen.add(n); const ps = parentOf(n); return ps.length ? 1 + Math.max(...ps.map(p => d(p, seen))) : 0; };
  classes.forEach(c => depth[c.n] = d(c.n));
  const rows = {};
  classes.forEach(c => { (rows[depth[c.n]] = rows[depth[c.n]] || []).push(c); });
  const box = {};
  let y = 10, maxW = 0;
  Object.keys(rows).sort((a, b) => a - b).forEach(r => {
    let x = 10, rowH = 0;
    rows[r].forEach(c => {
      const lines = [c.n, ...(c.f || []), ...(c.m || [])];
      const w = Math.max(120, Math.max(...lines.map(s => s.length)) * cw + pad * 2);
      const h = lh * (1 + Math.max(1, (c.f || []).length) + Math.max(1, (c.m || []).length)) + pad * 2 + 8;
      box[c.n] = { x, y, w, h, c }; x += w + 90; rowH = Math.max(rowH, h);
    });
    maxW = Math.max(maxW, x); y += rowH + 60;
  });
  const W = maxW, H = y - 40;
  let s = `<svg class="uml" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="UML class diagram"><defs>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="var(--surface)" stroke="var(--ink)"/></marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1 5 L8 1 L15 5 L8 9 z" fill="var(--surface)" stroke="var(--ink)"/></marker>
    <marker id="fdia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M1 5 L8 1 L15 5 L8 9 z" fill="var(--ink)" stroke="var(--ink)"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--ink)"/></marker></defs>`;
  links.forEach(([a, b, t]) => {
    const A = box[a], B = box[b]; if (!A || !B) return;
    let x1 = A.x + A.w / 2, y1 = A.y, x2 = B.x + B.w / 2, y2 = B.y + B.h;
    if (Math.abs(A.y - B.y) < 5) { y1 = A.y + A.h / 2; y2 = B.y + B.h / 2; x1 = A.x < B.x ? A.x + A.w : A.x; x2 = A.x < B.x ? B.x : B.x + B.w; }
    else if (A.y < B.y) { y1 = A.y + A.h; y2 = B.y; }
    const dash = t === "implements" ? ' stroke-dasharray="6 4"' : "";
    let mk = "";
    if (t === "extends" || t === "implements") mk = ' marker-end="url(#tri)"';
    else if (t === "has" || t === "aggregation") mk = ' marker-start="url(#dia)"';
    else if (t === "composition") mk = ' marker-start="url(#fdia)"';
    else if (t === "association") mk = ' marker-end="url(#arr)"';
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="1.5"${dash}${mk}/>`;
  });
  Object.values(box).forEach(({ x, y, w, h, c }) => {
    const fN = (c.f || []).length, fy = y + pad + lh + 6;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>`;
    s += `<text x="${x + w / 2}" y="${y + pad + 12}" text-anchor="middle" class="u-name" ${c.abs || c.iface ? 'font-style="italic"' : ""}>${c.iface ? "«interface» " : ""}${esc(c.n)}</text>`;
    s += `<line x1="${x}" y1="${fy - 2}" x2="${x + w}" y2="${fy - 2}" stroke="var(--ink)"/>`;
    (c.f || []).forEach((f, i) => { s += `<text x="${x + pad}" y="${fy + lh * (i + 1) - 4}" class="u-mem">${esc(f)}</text>`; });
    const my = fy + lh * Math.max(1, fN) + 4;
    s += `<line x1="${x}" y1="${my}" x2="${x + w}" y2="${my}" stroke="var(--ink)"/>`;
    (c.m || []).forEach((m, i) => { s += `<text x="${x + pad}" y="${my + lh * (i + 1) - 2}" class="u-mem">${esc(m)}</text>`; });
  });
  return `<div class="scroll-x uml-wrap">${s}</svg></div>`;
}
function umlLegend() { return `<p class="small muted">Hollow triangle: extends (dashed: implements). Hollow diamond at the owner: has-a (aggregation). Filled diamond: composition. Open arrow: association.</p>`; }

function viewTeach(app, id) {

function renderStep(body, st, unlock, u) {

      honest("Checks read your code for the required structure. They do not compile or run it, so also try it in your IDE.") + `<div id="wres"></div><div id="wai" class="ai-out"></div><div id="wmodel"></div>`;

function caseText(c, clickable) {
  return esc(c.text).replace(/\[([^|\]]+)\|([^\]]+)\]/g, (_, w, t) => clickable ? `<button class="noun" data-t="${t}">${w}</button>` : `<b>${w}</b>`);
}
function caseJavaChecks(c) {
  const out = [];
  c.classes.forEach(n => {
    const ex = c.rels.find(r => r[0] === n && r[2] === "extends");
    if ((c.exceptions || []).includes(n)) out.push([`${n} extends Exception`, String.raw`class\s+${n}\s+extends\s+Exception`, "Custom checked exceptions extend Exception."]);
    else if (ex) out.push([`class ${n} extends ${ex[1]}`, String.raw`class\s+${n}\s+extends\s+${ex[1]}\b`, ""]);
    else out.push([`class ${n}`, String.raw`class\s+${n}\b`, ""]);
  });
  (c.abstracts || []).forEach(n => out.push([`${n} is abstract`, String.raw`abstract\s+class\s+${n}\b`, "The design has an abstract method here."]));
  c.attrs.forEach(([a, n]) => out.push([`private field ${a} in ${n}`, String.raw`class\s+${n}\b[^]*?private\s+[\w<>\[\]]+\s+${a}\b`, `Declare ${a} as a private field inside ${n}.`]));
  c.methods.forEach(([m]) => { const name = m.replace("()", ""); out.push([`method ${m}`, String.raw`\b${name}\s*\(`, ""]); });
  c.rels.filter(r => r[2] === "has").forEach(r => out.push([`${r[0]} holds ${r[1]} objects`, String.raw`class\s+${r[0]}\b[^]*?\b${r[1]}\b`, `${r[0]} needs a field of type ${r[1]} or a list of them.`]));
  return out;
}

    $("#addRel").onclick = () => { const a = $("#rA").value, t = $("#rT").value, b = $("#rB").value; if (!a || !b || a === b) return; m.rels.push([a, t, b]); persist(); };
    $("#clr").onclick = () => { if (confirm("Clear this design?")) { m.classes = []; m.rels = []; persist(); } };
    $("#fbBtn").onclick = () => { const f = archFeedback(m, target); $("#archFb").innerHTML = f.length ? `<ul class="checklist">${f.map(x => `<li class="${x[0]}"><span aria-hidden="true">${x[0] === "pass" ? "✓" : "!"}</span> ${x[1]}</li>`).join("")}</ul>` : ""; ev("architect"); if (target && f.every(x => x[0] === "pass")) { markDone("architect:" + target.id); ev("uml-ok"); track(["design", "relationships"], "design", true); } save(); };
  }

}
function archFeedback(m, t) {
  const out = []; const norm = s => s.toLowerCase().replace(/s$/, "");
  if (!m.classes.length) return [["fail", "Start by adding the classes you found in the requirements."]];
  m.classes.forEach(c => { if (c.f.some(f => f.v === "public")) out.push(["fail", `Encapsulation issue: <code>${esc(c.n)}</code> has public attributes. Make fields private and expose methods instead.`]); });
  for (let i = 0; i < m.classes.length; i++) for (let j = i + 1; j < m.classes.length; j++) {
    const A = m.classes[i], B = m.classes[j];
    const shared = A.f.filter(f => B.f.some(g => norm(g.n) === norm(f.n))).map(f => f.n);
    const related = m.rels.some(r => (r[0] === A.n && r[2] === B.n) || (r[0] === B.n && r[2] === A.n));
    if (shared.length >= 2 && !related) out.push(["fail", `Possible inheritance: <code>${esc(A.n)}</code> and <code>${esc(B.n)}</code> both have ${shared.map(esc).join(", ")}. Would a common superclass remove the duplication?`]);
  }
  if (t) {
    const find = n => t.classes.find(x => norm(x) === norm(n));
    const missing = t.classes.filter(n => !m.classes.some(c => norm(c.n) === norm(n)));
    if (missing.length) out.push(["fail", `${missing.length} class${missing.length > 1 ? "es" : ""} from the requirements ${missing.length > 1 ? "are" : "is"} still missing. Reread the nouns.`]);
    m.classes.forEach(c => { if (!find(c.n)) out.push(["fail", `<code>${esc(c.n)}</code> may be unnecessary: is it really a separate object, or just data about another class or something outside the system?`]); });
    m.classes.forEach(c => {
      const rc = find(c.n); if (!rc) return;
      c.f.forEach(f => { const ref = t.attrs.find(a => norm(a[0]) === norm(f.n)); if (ref && ref[1] !== rc) out.push(["fail", `Attribute <code>${esc(f.n)}</code> seems to be in the wrong class. Which object does it describe?`]); });
      c.m.forEach(mm => { const ref = t.methods.find(a => norm(a[0].replace("()", "")) === norm(mm)); if (ref && ref[1] !== rc) out.push(["fail", `Method <code>${esc(mm)}()</code> may belong elsewhere: which class owns the data it uses?`]); });
    });
    t.attrs.forEach(([a, owner]) => { const oc = m.classes.find(c => norm(c.n) === norm(owner)); if (oc && !m.classes.some(c => c.f.some(f => norm(f.n) === norm(a)))) out.push(["fail", `<code>${esc(owner)}</code> is missing an attribute mentioned in the requirements.`]); });
    t.rels.filter(r => r[2] !== "none").forEach(([a, b, type]) => {
      if (!find(a) || !m.classes.some(c => norm(c.n) === norm(a)) || !m.classes.some(c => norm(c.n) === norm(b))) return;
      const ur = m.rels.find(r => norm(r[0]) === norm(a) && norm(r[2]) === norm(b)) || m.rels.find(r => norm(r[0]) === norm(b) && norm(r[2]) === norm(a));
      if (!ur) out.push(["fail", `Missing relationship: how are <code>${esc(a)}</code> and <code>${esc(b)}</code> connected?`]);
      else if (type === "extends" && ur[1] !== "extends") out.push(["fail", `Check <code>${esc(a)}</code> and <code>${esc(b)}</code> with the is-a test.`]);
      else if (type === "extends" && norm(ur[0]) !== norm(a)) out.push(["fail", `The inheritance between <code>${esc(a)}</code> and <code>${esc(b)}</code> points the wrong way.`]);
      else if (type === "has" && ur[1] === "extends") out.push(["fail", `<code>${esc(a)}</code> and <code>${esc(b)}</code>: is it really “is-a”, or “has-a”?`]);
    });
    (t.abstracts || []).forEach(n => { const c = m.classes.find(x => norm(x.n) === norm(n)); if (c && !c.abs) out.push(["fail", `Should <code>${esc(n)}</code> be abstract? The requirements say each kind calculates something differently.`]); });
  }
  if (!out.length) out.push(["pass", t ? "No problems found against the requirements. Next, write the Java in the matching case study." : "No structural problems found."]);
  return out;
}

/* ================= CONSTRUCTOR CHAIN SIMULATOR ================= */
function viewCtor(app) {
  const cfg = S.ctorCfg || (S.ctorCfg = {
    Person: { noarg: { on: true, first: "implicit" }, str: { on: false, first: "implicit" } },
    Employee: { noarg: { on: true, first: "this(s)" }, str: { on: true, first: "implicit" } },
    Faculty: { noarg: { on: true, first: "implicit" }, str: { on: false, first: "implicit" } },
    call: "noarg"
  });
  const chain = ["Person", "Employee", "Faculty"], parent = { Person: "Object", Employee: "Person", Faculty: "Employee" };
  const firsts = ["implicit", "super()", "super(s)", "this()", "this(s)"];
  function code() {
    return chain.map(c => {
      const ctors = [];
      ["noarg", "str"].forEach(k => {
        const ct = cfg[c][k]; if (!ct.on) return;
        const f = ct.first === "implicit" ? "" : `        ${ct.first.replace("(s)", '("from ' + c + '")')};\n`;
        ctors.push(`    ${c}(${k === "str" ? "String s" : ""}) {\n${f}        System.out.println("${c}(${k === "str" ? "String" : ""}) body");\n    }`);
      });
      return `class ${c}${parent[c] !== "Object" ? " extends " + parent[c] : ""} {\n${ctors.join("\n\n") || "    // no constructors written: Java adds a default no-arg one"}\n}`;
    }).join("\n\n") + `\n\n// main:\nnew Faculty(${cfg.call === "str" ? '"x"' : ""});`;
  }
  function simulate() {
    const steps = [], out = [];
    const hasAny = c => cfg[c].noarg.on || cfg[c].str.on;
    const exists = (c, k) => c === "Object" ? k === "noarg" : (hasAny(c) ? cfg[c][k].on : k === "noarg");
    const stack = [];
    function exec(c, k, depth) {
      const sig = `${c}(${k === "str" ? "String" : ""})`;
      if (!exists(c, k)) throw `Compile error: ${c} has no constructor ${sig}.${c !== "Object" && !hasAny(c) && k === "noarg" ? "" : c !== "Object" && hasAny(c) && k === "noarg" ? ` Because ${c} declares a constructor, Java does not add a default no-arg one.` : ""}`;
      if (stack.includes(sig)) throw `Compile error: recursive constructor invocation in ${sig}.`;
      stack.push(sig);
      steps.push({ depth, text: `Enter ${sig}`, stack: [...stack] });
      if (c !== "Object") {
        const first = hasAny(c) ? cfg[c][k].first : "implicit";
        if (first === "implicit" || first === "super()") { steps.push({ depth, text: `${first === "implicit" ? "No super/this written, so the compiler inserts super()" : "super()"} → ${parent[c]}()`, stack: [...stack] }); exec(parent[c], "noarg", depth + 1); }
        else if (first === "super(s)") { if (parent[c] === "Object") throw `Compile error: Object has no constructor that takes a String.`; steps.push({ depth, text: `super(s) → ${parent[c]}(String)`, stack: [...stack] }); exec(parent[c], "str", depth + 1); }
        else { const kk = first === "this()" ? "noarg" : "str"; steps.push({ depth, text: `${first} → another ${c} constructor, ${c}(${kk === "str" ? "String" : ""})`, stack: [...stack] }); exec(c, kk, depth + 1); }
        steps.push({ depth, text: `Run body of ${sig}: prints "${sig} body"`, stack: [...stack], print: `${sig} body` }); out.push(`${sig} body`);
      } else steps.push({ depth, text: "Object() finishes (no output)", stack: [...stack] });
      stack.pop();
    }
    const pre = validate(); if (pre) return { steps: [], out: [], error: pre };
    try { exec("Faculty", cfg.call, 0); return { steps, out }; } catch (e) { return { steps, out, error: e }; }
  }
  function validate() {
    const hasAny = c => cfg[c].noarg.on || cfg[c].str.on;
    const exists = (c, k) => c === "Object" ? k === "noarg" : (hasAny(c) ? cfg[c][k].on : k === "noarg");
    const sigOf = (c, k) => `${c}(${k === "str" ? "String" : ""})`;
    for (const c of chain) {
      const ks = hasAny(c) ? ["noarg", "str"].filter(k => cfg[c][k].on) : ["noarg"];
      for (const k of ks) {
        const first = hasAny(c) ? cfg[c][k].first : "implicit";
        if (first === "implicit" || first === "super()") { if (!exists(parent[c], "noarg")) return `Compile error in ${sigOf(c, k)}: it ${first === "implicit" ? (hasAny(c) ? "implicitly calls" : "is Java's default constructor, which calls") : "calls"} super(), but ${parent[c]} has no no-arg constructor.${hasAny(parent[c]) ? ` ${parent[c]} declares a constructor, so Java does not add a default one.` : ""}`; }
        else if (first === "super(s)") { if (!exists(parent[c], "str")) return `Compile error in ${sigOf(c, k)}: ${parent[c]} has no constructor that takes a String.`; }
        else { const kk = first === "this()" ? "noarg" : "str"; if (!exists(c, kk)) return `Compile error in ${sigOf(c, k)}: ${first} refers to ${sigOf(c, kk)}, which does not exist.`; }
      }
      const nx = k => { const f = cfg[c][k].first; return f === "this()" ? "noarg" : f === "this(s)" ? "str" : null; };
      if (hasAny(c)) for (const k of ["noarg", "str"].filter(k => cfg[c][k].on)) {
        let cur = k, seen = new Set();
        while (cur && cfg[c][cur].on) { if (seen.has(cur)) return `Compile error: recursive constructor invocation in ${c} (constructors call each other with this(...) in a loop).`; seen.add(cur); cur = nx(cur); }
      }
    }
    return null;
  }
  function draw() {
    const r = simulate();
    app.innerHTML = crumbs([["Simulators", "#/sim"], ["Constructor chain"]]) + `<div class="pagehead"><h1>Constructor chain simulator</h1><p>Object ← Person ← Employee ← Faculty. Choose which constructors exist and what each one calls first, then watch <code>new Faculty()</code> run.</p></div>
    <div class="build-grid"><div class="panel">
      <h3>Configure</h3>${chain.map(c => `<div class="cfg"><b>${c}</b>${["noarg", "str"].map(k => `<div class="row"><label><input type="checkbox" data-c="${c}" data-k="${k}" ${cfg[c][k].on ? "checked" : ""}> ${c}(${k === "str" ? "String s" : ""})</label> first statement <select data-fc="${c}" data-k="${k}" ${cfg[c][k].on ? "" : "disabled"}>${firsts.map(f => `<option ${cfg[c][k].first === f ? "selected" : ""}>${f}</option>`).join("")}</select></div>`).join("")}</div>`).join("")}
      <div class="row"><b>main calls</b> <select id="callSel"><option value="noarg" ${cfg.call === "noarg" ? "selected" : ""}>new Faculty()</option><option value="str" ${cfg.call === "str" ? "selected" : ""}>new Faculty("x")</option></select></div>
      <div class="lesson-actions"><button class="btn small ghost" id="preset1">Liang's Faculty example</button><button class="btn small ghost" id="preset2">Apple/Fruit error</button></div>
      ${codeBlock(code())}</div>
    <div class="panel"><div class="lesson-actions"><button class="btn" id="predictBtn">Predict first</button><button class="btn ghost" id="showBtn">Show execution</button></div><div id="pred"></div><div id="exec"></div></div></div>`;
    $$("[data-c]").forEach(cb => cb.onchange = () => { cfg[cb.dataset.c][cb.dataset.k].on = cb.checked; save(); draw(); });
    $$("[data-fc]").forEach(s => s.onchange = () => { cfg[s.dataset.fc][s.dataset.k].first = s.value; save(); draw(); });
    $("#callSel").onchange = e => { cfg.call = e.target.value; save(); draw(); };
    $("#preset1").onclick = () => { Object.assign(cfg, { Person: { noarg: { on: true, first: "implicit" }, str: { on: false, first: "implicit" } }, Employee: { noarg: { on: true, first: "this(s)" }, str: { on: true, first: "implicit" } }, Faculty: { noarg: { on: true, first: "implicit" }, str: { on: false, first: "implicit" } }, call: "noarg" }); save(); draw(); };
    $("#preset2").onclick = () => { Object.assign(cfg, { Person: { noarg: { on: false, first: "implicit" }, str: { on: true, first: "implicit" } }, Employee: { noarg: { on: false, first: "implicit" }, str: { on: false, first: "implicit" } }, Faculty: { noarg: { on: false, first: "implicit" }, str: { on: false, first: "implicit" } }, call: "noarg" }); save(); draw(); toast("Person only has Person(String); Employee writes no constructors"); };
    const showExec = () => {
      $("#exec").innerHTML = `<h3>Execution</h3><ol class="chain">${r.steps.map(s => `<li style="margin-left:${s.depth * 16}px" class="${s.print ? "print" : ""}">${esc(s.text)}</li>`).join("")}</ol>` +
        (r.error ? `<div class="verdict no">${esc(r.error)}</div><p class="small">Nothing runs when a program fails to compile; Fix the configuration and try again.</p>` : `<h3>Output</h3><pre class="code"><code>${esc(r.out.join("\n"))}</code></pre>`);
      markDone("ctor"); ev("ctor-run");
    };
    $("#showBtn").onclick = showExec;
    $("#predictBtn").onclick = () => {
      $("#pred").innerHTML = `<label class="small"><b>Type the output</b> (or type <code>compile error</code>):</label><textarea class="editor" id="pIn" rows="4"></textarea><button class="btn small" id="pChk">Check</button><div id="pRes"></div>`;
      $("#pChk").onclick = () => {
        const t = $("#pIn").value.trim();
        const ok = r.error ? /compile/i.test(t) : t.split("\n").map(x => x.trim()).join("\n") === r.out.join("\n");
        $("#pRes").innerHTML = `<div class="verdict ${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite. See the execution."}</div>`;
        track(["constructors", "inheritance"], "tracing", ok); if (ok) ev("ctor-predict-ok");
        showExec();
      };
    };
  }
  draw();
}

/* ================= POLYMORPHISM PLAYGROUND & BATTLE ================= */
const POLY = {
  Object: { parent: null, methods: { "toString()": "Object@1b6d" } },
  Animal: { parent: "Object", methods: { "sound()": "...", "eat()": "Animal eats", "toString()": "an Animal" } },
  Dog: { parent: "Animal", methods: { "sound()": "Woof", "fetch()": "Dog fetches" } },
  Puppy: { parent: "Dog", methods: { "sound()": "Yip" } },
  Cat: { parent: "Animal", methods: { "sound()": "Meow", "purr()": "Purr" } }
};
function isSub(a, b) { for (let c = a; c; c = POLY[c].parent) if (c === b) return true; return false; }
function lookup(type, m) { for (let c = type; c; c = POLY[c].parent) if (POLY[c].methods[m] !== undefined) return c; return null; }
function polyEval(ref, obj, cast, m) {
  const steps = [];
  if (!isSub(obj, ref)) return { err: "compile", msg: isSub(ref, obj) ? `Compile error: incompatible types. A ${obj} is not necessarily a ${ref}; assigning a supertype object to a subtype variable is not allowed.` : `Compile error: ${obj} and ${ref} are unrelated types.`, steps };
  steps.push(`Reference type: ${ref}. Actual object: ${obj}. The assignment is allowed because a ${obj} is a ${ref} (upcasting).`);
  let staticType = ref;
  if (cast) {
    if (!isSub(cast, ref) && !isSub(ref, cast)) return { err: "compile", msg: `Compile error: cannot cast ${ref} to ${cast}; the types are unrelated.`, steps };
    steps.push(`Cast to ${cast} compiles because ${cast} and ${ref} are in the same hierarchy.`);
    staticType = cast;
  }
  const declared = lookup(staticType, m);
  if (!declared) return { err: "compile", msg: `Compile error: cannot find symbol ${m} in ${staticType}. The compiler only knows the ${cast ? "cast" : "reference"} type.`, steps };
  steps.push(`Compile time: ${staticType} has ${m} (declared in ${declared}), so the call compiles.`);
  if (cast) {
    if (!isSub(obj, cast)) return { err: "runtime", msg: `Runtime error: ClassCastException. The object is really a ${obj}, which is not a ${cast}.`, steps };
    steps.push(`At runtime the object is a ${obj}, which is a ${cast}, so the cast succeeds.`);
  }
  const runner = lookup(obj, m);
  const path = []; for (let c = obj; c; c = POLY[c].parent) { path.push(c); if (c === runner) break; }
  steps.push(`Runtime (dynamic binding): search starts at ${obj}${path.length > 1 ? " and moves up: " + path.join(" → ") : ""}. First implementation found: ${runner}.${m}.`);

const EXC = {

  FileNotFoundException: ["FileNotFoundException", "IOException", "Exception"],

      const t = m === "methodC" ? cfg.type : declType;

        if (h.fin) { log.push({ m, t: `${m}: finally runs.` }); out.push(`${m} finally`); }

        if (h.fin) { log.push({ m, t: `${m}: finally runs before the exception leaves.` }); out.push(`${m} finally`); }

}
function excCode(cfg) {
  const order = ["main", "methodA", "methodB", "methodC"], callee = { main: "methodA", methodA: "methodB", methodB: "methodC" };

  const decl = chain.includes("IOException") ? "IOException" : cfg.type;

    const h = cfg.m[m]; const sig = m === "main" ? "public static void main(String[] args)" : `static void ${m}()`;
    const throwsPart = h.throws ? ` throws ${decl}` : "";

function gameBattle(app) {

  function make() {
    for (let t = 0; t < 50; t++) {
      const obj = pick(objs); const ref = pick(types.filter(x => isSub(obj, x) || Math.random() < 0.15));
      const cast = Math.random() < 0.35 ? pick(objs) : ""; const m = pick(ms);

  if (level === 4) return Q.filter(q => (q.qid.startsWith("trap") || q.qid.startsWith("con")) && has(q)).map(q => ({ type: "q", q }));

function weakPrereq(skill) {

    queue.push(...SKILLS.find(s => s.id === id).pre);
  }

}

function mistakePatterns() {
  const reasons = Object.entries(S.reasons).sort((a, b) => b[1] - a[1]);
  const conf = Object.entries(S.confuse).sort((a, b) => b[1] - a[1]);
  if (!reasons.length && !conf.length) return `<p class="muted">When you get something wrong, pick a reason. Patterns will show up here.</p>`;
  const ord = ["Most common", "Second", "Third"];
  return (conf.length ? `<h4>Concepts you mix up</h4><ol>${conf.slice(0, 3).map(([k, v], i) => `<li><b>${ord[i]}:</b> ${esc(k)} <span class="muted small">(${v})</span></li>`).join("")}</ol><a class="chipbtn" href="#/traps">Practise traps</a>` : "")
    + (reasons.length ? `<h4 style="margin-top:14px">Why you miss questions</h4><ul>${reasons.slice(0, 4).map(([k, v]) => `<li>${esc(k)} <span class="muted small">×${v}</span></li>`).join("")}</ul><p class="small">${reasonTip(reasons[0][0])}</p>` : "");
}
