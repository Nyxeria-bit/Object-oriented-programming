<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ObjectLab · Learn Java OOP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FF; --surface:#FFFFFF; --surface-2:#ECE8FF; --ink:#221D45; --muted:#5C5783; --line:#DDD7F6;
  --violet:#6A45F0; --violet-soft:#E6DFFF; --teal:#0C8F87; --teal-soft:#D4F4F0;
  --coral:#E0456C; --coral-soft:#FFE0E8; --sun:#B77A00; --sun-soft:#FFF0C7; --sky:#2F7BEA;
  --ok:#11845B; --ok-soft:#D9F5E8; --bad:#C8364F; --bad-soft:#FFE1E6;
  --code-bg:#1D1936; --code-ink:#E9E6FF;
  --shadow:0 1px 0 rgba(34,29,69,.06), 0 8px 24px -12px rgba(34,29,69,.25);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16132A; --surface:#211D3C; --surface-2:#2B2650; --ink:#F2EFFF; --muted:#B5AFDA; --line:#3A3464;
    --violet:#A58CFF; --violet-soft:#352B66; --teal:#3CD3C6; --teal-soft:#173F44;
    --coral:#FF7E9D; --coral-soft:#4A2238; --sun:#FFC94D; --sun-soft:#433517;
    --ok:#4DDBA0; --ok-soft:#173D32; --bad:#FF8196; --bad-soft:#4A2130;
    --code-bg:#110E22; --code-ink:#E9E6FF; --shadow:0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16132A; --surface:#211D3C; --surface-2:#2B2650; --ink:#F2EFFF; --muted:#B5AFDA; --line:#3A3464;
  --violet:#A58CFF; --violet-soft:#352B66; --teal:#3CD3C6; --teal-soft:#173F44;
  --coral:#FF7E9D; --coral-soft:#4A2238; --sun:#FFC94D; --sun-soft:#433517;
  --ok:#4DDBA0; --ok-soft:#173D32; --bad:#FF8196; --bad-soft:#4A2130;
  --code-bg:#110E22; --code-ink:#E9E6FF; --shadow:0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--violet)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.5vw,3.25rem);font-weight:800}
h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0 0 1em}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:.08em .38em;border-radius:6px;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.content{min-width:0}
.hero>*,.lesson-grid>*,.trace-wrap>*,.quizbox,.panel{min-width:0}
.side{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.35rem;text-decoration:none;color:var(--ink)}
.brand .logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--violet);color:#fff;font-size:1.1rem}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--violet-soft);color:var(--violet)}
.nav .badge{margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.6}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.xpbox{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.xpbox .row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.xpbox strong{color:var(--ink);font-family:var(--display)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--violet);border-radius:999px;transition:width .4s}
.theme-btn{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted);font-weight:700}
.theme-btn:hover{color:var(--ink)}
main{padding:36px clamp(18px,4vw,56px) 80px;max-width:1080px;width:100%}

/* generic bits */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--violet);color:#fff;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--violet)}
.btn.small{padding:7px 14px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px}
.stack>*+*{margin-top:18px}
.crumbs{font-size:.92rem;margin-bottom:14px}
.crumbs a{text-decoration:none;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:2px 9px;font-size:.84rem;font-weight:700}
.c-teal{--c:var(--teal);--cs:var(--teal-soft)}
.c-violet{--c:var(--violet);--cs:var(--violet-soft)}
.c-coral{--c:var(--coral);--cs:var(--coral-soft)}
.c-sun{--c:var(--sun);--cs:var(--sun-soft)}
.chip.tone{background:var(--cs);color:var(--c)}
.pagehead{margin-bottom:26px}
.pagehead p{max-width:62ch;color:var(--muted);font-size:1.05rem}

/* code */
pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:.86rem;line-height:1.65;padding:18px 20px;border-radius:16px;overflow-x:auto;margin:0 0 1em;tab-size:2}
pre.code code{background:none;padding:0;white-space:pre;font-size:inherit;color:inherit}
.t-kw{color:#C4A6FF;font-weight:600}.t-type{color:#6FE3D6}.t-str{color:#FFD27A}.t-com{color:#8E88B8;font-style:italic}.t-num{color:#FF9EB6}.t-ann{color:#FF9EB6}

/* home */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;margin-bottom:40px}
.hero h1{max-width:14ch}
.hero .lede{font-size:1.12rem;color:var(--muted);max-width:44ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.factory{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.factory pre.code{margin-bottom:12px;font-size:.8rem}
.factory-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.static-count{font-family:var(--mono);font-size:.85rem;background:var(--sun-soft);color:var(--sun);padding:4px 10px;border-radius:8px;font-weight:600}
.heap{display:flex;flex-wrap:wrap;gap:8px;min-height:92px;align-content:flex-start;padding:10px;border:2px dashed var(--line);border-radius:16px;position:relative}
.heap:empty::before{content:"Objects you create appear here";color:var(--muted);font-size:.9rem;margin:auto}
.obj{font-family:var(--mono);font-size:.78rem;background:var(--violet-soft);color:var(--ink);border-radius:12px;padding:8px 10px;border-left:4px solid var(--violet);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.obj b{color:var(--violet)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.factory-note{font-size:.88rem;color:var(--muted);margin:10px 2px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:34px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.continue{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--violet);color:#fff;border-radius:22px;padding:22px 26px;margin-bottom:34px}
.continue h3{margin:0}
.continue p{margin:0;opacity:.85}
.continue .btn{background:#fff;color:#3A22A8}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.section-title a{font-weight:700;text-decoration:none}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.game-card{display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.game-card:hover{border-color:var(--c)}
.game-card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c);font-size:1.4rem;margin-bottom:4px}
.game-card h3{margin:0;font-size:1.12rem}
.game-card p{margin:0;color:var(--muted);font-size:.93rem}
.game-card .best{margin-top:auto;padding-top:8px;font-size:.85rem;font-weight:700;color:var(--c)}

/* learn list */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:26px;max-width:520px}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);padding:8px 0;outline:none}
.part{margin-bottom:30px}
.part-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.part-head .dot{width:12px;height:12px;border-radius:4px;background:var(--c)}
.part-head h2{margin:0;font-size:1.3rem}
.part-head span{color:var(--muted);font-size:.92rem}
.mod-list{display:grid;gap:8px}
.mod{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink)}
.mod:hover{border-color:var(--c)}
.mod .num{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.35rem;background:var(--cs);color:var(--c)}
.mod h3{margin:0 0 2px;font-size:1.08rem}
.mod p{margin:0;color:var(--muted);font-size:.93rem}
.mod .status{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.84rem;font-weight:700;color:var(--muted);white-space:nowrap}
.mod .status .done{color:var(--ok)}

/* lesson */
.lesson-head{border-radius:26px;padding:28px;background:var(--cs);color:var(--ink);margin-bottom:26px;position:relative;overflow:hidden}
.lesson-head .big{position:absolute;right:18px;top:-24px;font-family:var(--display);font-weight:800;font-size:9rem;line-height:1;color:var(--c);opacity:.18;pointer-events:none}
.lesson-head h1{font-size:clamp(1.8rem,4vw,2.7rem);max-width:20ch;position:relative}
.lesson-head p{max-width:60ch;margin:0;position:relative}
.lesson-grid{display:grid;grid-template-columns:1fr 230px;gap:28px;align-items:start}
.toc{position:sticky;top:24px;font-size:.93rem}
.toc h4{font-size:.95rem;color:var(--muted);margin-bottom:8px}
.toc ol{margin:0;padding-left:20px}
.toc li{margin:4px 0}
.toc a{color:var(--ink);text-decoration:none}
.toc a:hover{color:var(--violet)}
.lsec{margin-bottom:30px;scroll-margin-top:20px}
.lsec p{max-width:70ch}
.tt{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
.tt th,.tt td{border:1px solid var(--line);padding:7px 10px;text-align:center}
.tt th{background:var(--surface-2);font-family:var(--display)}
.tt td:first-child,.tt th:first-child{text-align:left}
.scroll-x{overflow-x:auto;margin-bottom:1em}
.takeaways{background:var(--surface);border:2px solid var(--c);border-radius:22px;padding:20px 24px;margin:10px 0 24px}
.takeaways h3{margin-bottom:10px}
.takeaways ul{margin:0;padding-left:20px}
.takeaways li{margin:4px 0}
.lesson-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager a{text-decoration:none;font-weight:700}

/* quiz */
.quizbox{max-width:760px}
.qhead{display:flex;align-items:center;gap:14px;font-size:.9rem;color:var(--muted);margin-bottom:16px;font-weight:700}
.qhead .bar{flex:1;margin:0}
.qtext{font-size:1.3rem;margin-bottom:14px;font-family:var(--body);font-weight:700;line-height:1.4}
.opts{display:grid;gap:10px;margin-bottom:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.85rem;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.fb{min-height:10px}
.fb .verdict{font-weight:700;font-family:var(--display);font-size:1.1rem}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.no{color:var(--bad)}
.fb .explain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0 14px}
.result{text-align:center;padding:30px 20px}
.result .score{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;color:var(--violet)}
.result .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.kbd-hint{font-size:.84rem;color:var(--muted);margin-top:10px}
kbd{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--surface)}

/* isa game */
.pair{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 22px}
.pair .cls{font-family:var(--mono);font-weight:600;font-size:1.1rem;padding:14px 18px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow)}
.pair .rel{font-family:var(--display);font-size:1.6rem;color:var(--muted)}

/* speed */
.timer{font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--coral);min-width:3ch;text-align:right}
.speed-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.speed-top .sc{font-weight:700}

/* memory */
.mem-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px;color:var(--muted);font-weight:700}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1.5;border-radius:16px;border:0;background:var(--violet);color:#fff;padding:10px;font-size:.84rem;line-height:1.3;display:grid;place-items:center;text-align:center;transition:transform .25s,background .2s}
.tile .face{display:none}
.tile .back{font-family:var(--display);font-size:1.8rem;font-weight:800;opacity:.9}
.tile.open,.tile.matched{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);transform:rotateY(0)}
.tile.open .face,.tile.matched .face{display:block}
.tile.open .back,.tile.matched .back{display:none}
.tile.term .face{font-family:var(--display);font-weight:700;font-size:1rem}
.tile.matched{box-shadow:inset 0 0 0 2px var(--ok);background:var(--ok-soft)}
.tile.miss{box-shadow:inset 0 0 0 2px var(--bad);background:var(--bad-soft)}

/* trace game */
.trace-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.trace-in{width:100%;min-width:56px;font:inherit;font-family:var(--mono);text-align:center;border:2px solid var(--line);border-radius:8px;padding:6px;background:var(--surface);color:var(--ink)}
.trace-in.good{border-color:var(--ok);background:var(--ok-soft)}
.trace-in.badv{border-color:var(--bad);background:var(--bad-soft)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem}
.tab[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}

/* flashcards */
.fc-area{max-width:640px;margin:0 auto}
.flash{perspective:1400px;height:300px;margin:8px 0 16px;cursor:pointer}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-side{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.flash-front{background:var(--violet);color:#fff}
.flash-front .t{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem)}
.flash-back{background:var(--surface);border:2px solid var(--violet);transform:rotateY(180deg);font-size:1.15rem}
.flash-side small{position:absolute;bottom:16px;font-size:.84rem;opacity:.8}
.fc-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.fc-actions .again{background:var(--coral)}
.fc-actions .got{background:var(--ok)}

/* progress */
.prog-row{display:grid;grid-template-columns:44px 1fr 110px 90px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prog-row .num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--cs);color:var(--c)}
.prog-row .bar{margin:4px 0 0}
.prog-row .bar i{background:var(--c)}
.prog-row .pct{font-weight:700;text-align:right}
.review-item{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.review-item p{margin:0}
.empty{text-align:center;padding:40px 20px}
.empty .big{font-size:3rem}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}

/* responsive */
@media (max-width: 900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;height:auto;top:auto;flex-direction:row;padding:6px 8px;border-right:0;border-top:1px solid var(--line);z-index:40;gap:0}
  .side .brand,.side-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 6px;flex:1;text-align:center}
  .nav .badge{position:absolute;margin:0 0 0 18px;font-size:.62rem}
  .nav a{position:relative}
  main{padding:22px 16px 110px}
  .mobile-top{display:flex !important}
  .hero,.lesson-grid,.trace-wrap{grid-template-columns:1fr}
  .toc{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .mem-grid{grid-template-columns:repeat(3,1fr)}
  .tile{aspect-ratio:1.1}
  .mobile-top .brand{display:flex;font-size:1.15rem}
  .mobile-top .logo{width:30px;height:30px;font-size:.9rem}
  .mobile-top .theme-btn{padding:6px 8px}

const MODULES = [
/* ---------------- CHAPTER 1 ---------------- */
{
  id: "ch1", num: "1", part: "found",
  title: "Computers, programs, and Java",
  blurb: "Hardware basics, how Java code becomes a running program, and the three kinds of errors.",
  sections: [
    { h: "What a computer is made of",
      p: ["The CPU carries out instructions. Memory holds the program and data while it runs, and storage devices keep data when the power is off. Input devices (keyboard, mouse) and output devices (screen, printer) connect the computer to people.",
          "Everything is stored as bits, which are 0s and 1s. Eight bits make one byte, so a character like 'A' fits in a byte."] },
    { h: "From machine code to Java",
      p: ["Machine language is raw binary that a CPU understands directly. Assembly language replaces binary with short words like [[add]] and needs an assembler. High-level languages such as Java read closer to English.",
          "The compiler [[javac]] turns your source file into bytecode stored in a [[.class]] file. The Java Virtual Machine (JVM) runs that bytecode, which is why the same compiled program can run on Windows, macOS, or Linux."] },
    { h: "Anatomy of a first program",
      code: String.raw`// This program prints a welcome message
public class Welcome {
  public static void main(String[] args) {
    System.out.println("Welcome to Java!");
  }
}`,
      p: ["The class name must match the file name, so this lives in [[Welcome.java]]. [[main]] is where the program starts. Each statement ends with a semicolon, and braces mark a block.",
          "Compile with [[javac Welcome.java]], then run with [[java Welcome]]."] },
    { h: "Three kinds of errors",
      p: ["A syntax error (compile error) breaks the rules of the language, such as a missing semicolon, so the program never compiles. A runtime error makes a compiled program stop while running, such as dividing an integer by zero. A logic error lets the program run but gives the wrong result."] }
  ],
  takeaways: ["javac compiles source into bytecode; java runs it on the JVM.", "Class name must match the file name.", "Syntax errors stop compiling, runtime errors crash, logic errors give wrong answers.", "Use comments, consistent indentation, and clear names."],
  terms: [["Bytecode", "The instructions javac produces, stored in .class files and run by the JVM."], ["JVM", "The Java Virtual Machine, which runs bytecode on any platform."], ["Syntax error", "A rule of the language is broken, so the program does not compile."], ["Logic error", "The program runs but produces an incorrect result."]],
  quiz: [
    { q: "Which command compiles Welcome.java?", o: ["[[java Welcome.java]]", "[[javac Welcome.java]]", "[[run Welcome]]", "[[jvm Welcome]]"], a: 1, e: "javac is the Java compiler. java is used afterwards to run the compiled class." },
    { q: "What does compiling Welcome.java produce?", o: ["Welcome.exe", "Welcome.class, containing bytecode", "Welcome.txt", "A copy of the source file"], a: 1, e: "The compiler writes bytecode into Welcome.class, which the JVM then runs." },
    { q: "A program runs to the end but prints the wrong average. What kind of error is this?", o: ["Syntax error", "Runtime error", "Logic error", "Compile error"], a: 2, e: "It compiled and did not crash, so the problem is in the logic." },
    { q: "How many bits are in one byte?", o: ["4", "8", "16", "32"], a: 1, e: "A byte is 8 bits." }

{

  sections: [
    { h: "Variables, constants, and input",
      code: String.raw`import java.util.Scanner;

public class ComputeArea {
  public static void main(String[] args) {
    Scanner input = new Scanner(System.in);
    System.out.print("Enter a radius: ");
    double radius = input.nextDouble();

    final double PI = 3.14159;   // a named constant
    double area = radius * radius * PI;
    System.out.println("The area is " + area);
  }
}`,

    { h: "Numeric types",
      p: ["Integer types: [[byte]] (8 bits), [[short]] (16), [[int]] (32), [[long]] (64). Floating-point types: [[float]] (32) and [[double]] (64). A number with a decimal point such as [[5.0]] is a double by default.",

{

public class Circle extends GeometricObject {

  }

  }

      p: ["A subclass inherits accessible fields and methods and can add its own. Private members of the superclass are not directly accessible in the subclass. A Java class can extend only one class."] },
    { h: "super and constructor chaining",
      p: ["A constructor's first statement is either [[super(...)]] or [[this(...)]]. If you write neither, the compiler inserts [[super()]]. So creating a subclass object runs the superclass constructors first, all the way up to [[Object]].",
          "If the superclass has no no-arg constructor, a subclass constructor that relies on the implicit [[super()]] will not compile."] },
    { h: "Overriding vs overloading",
      p: ["Overriding gives a subclass its own version of an inherited method with the same signature. Overloading means same name, different parameters. [[@Override]] asks the compiler to check you really are overriding.",
          "Private methods cannot be overridden, and static methods are hidden rather than overridden. Every class extends [[Object]], so you often override [[toString()]] and [[equals(Object)]]."] },
    { h: "Polymorphism and dynamic binding",
      code: String.raw`GeometricObject shape = new Circle(2);  // upcasting is automatic
System.out.println(shape.toString());   // Circle's version runs

if (shape instanceof Circle) {
  Circle c = (Circle) shape;            // explicit downcast
}

if (shape instanceof Circle c) {        // pattern matching, Java 16+
  System.out.println(c.toString());
}`,
      p: ["A superclass variable can refer to a subclass object. Which overridden method runs is decided at runtime by the actual object type; this is dynamic binding. Writing methods that accept the superclass type is generic programming."] },
    { h: "ArrayList, protected, and final",
      code: String.raw`ArrayList<String> cities = new ArrayList<>();

cities.add("Tamale");

cities.size();                 // 3
cities.remove("Tamale");
java.util.Collections.sort(cities);`,

{
  id: "ch12", num: "12", part: "oop",
  title: "Exception handling and text I/O",
  blurb: "try-catch-finally, checked vs unchecked, custom exceptions, File, PrintWriter, Scanner.",
  sections: [
    { h: "Why exceptions",
      code: String.raw`public static int quotient(int n1, int n2) {
  if (n2 == 0)
    throw new ArithmeticException("Divisor cannot be zero");
  return n1 / n2;
}

try {
  int result = quotient(5, 0);
  System.out.println(result);        // skipped
} catch (ArithmeticException ex) {
  System.out.println("Error: " + ex.getMessage());
} finally {
  System.out.println("Done");        // always runs
}`,
      p: ["Exceptions separate detecting an error (the method) from deciding what to do (the caller)."] },
    { h: "The exception hierarchy",
      p: ["[[Throwable]] has two branches. [[Error]] covers serious system problems such as running out of memory. [[Exception]] covers problems a program can handle.",
          "[[RuntimeException]] (for example NullPointerException, ArithmeticException, ArrayIndexOutOfBoundsException) and [[Error]] are unchecked. All other exceptions, such as IOException, are checked: the compiler forces you to catch them or declare them with [[throws]]."] },
    { h: "throw, throws, and propagation",
      p: ["[[throw]] creates and throws an exception object. [[throws]] in a method header declares that it may throw. If a method does not catch an exception, it passes up the call stack until something catches it or the program ends.",
          "Catch blocks for subclasses must come before catch blocks for their superclasses. You can define your own exception by extending Exception, and wrap one exception in another (a chained exception)."],
      code: String.raw`public class InvalidRadiusException extends Exception {
  public InvalidRadiusException(double radius) {
    super("Invalid radius " + radius);
  }
}` },
    { h: "Reading and writing text files",
      code: String.raw`public static void main(String[] args) throws Exception {
  File file = new File("scores.txt");
  System.out.println(file.exists());

  try (PrintWriter output = new PrintWriter(file)) {
    output.println("Ama 90");
    output.println("Kofi 85");
  }   // closed automatically

  try (Scanner input = new Scanner(file)) {
    while (input.hasNext()) {
      String name = input.next();
      int score = input.nextInt();
      System.out.println(name + " " + score);
    }
  }
}`,
      p: ["The [[File]] class describes a file or directory (exists, length, delete) but does not read contents. Use PrintWriter to write and Scanner to read. try-with-resources closes them for you.",
          "Liang also reads web pages by giving a Scanner the input stream of a URL, and builds a simple web crawler that keeps a list of pages to visit and pages already visited."] }
  ],
  takeaways: ["finally runs whether or not an exception occurs.", "RuntimeException and Error are unchecked; others are checked.", "throw throws; throws declares.", "Catch subclasses before superclasses."],
  terms: [["Checked exception", "Must be caught or declared with throws, such as IOException."], ["Unchecked exception", "RuntimeException, Error, and their subclasses; the compiler does not force handling."], ["finally", "A block that runs after try/catch regardless of what happened."], ["try-with-resources", "try (Resource r = ...) closes the resource automatically."]],
  quiz: [
    { q: "Which of these is a checked exception?", o: ["NullPointerException", "ArithmeticException", "IOException", "ArrayIndexOutOfBoundsException"], a: 2, e: "The others are RuntimeException subclasses, which are unchecked." },
    { q: "When does a finally block run?", o: ["Only when no exception occurs", "Only when an exception occurs", "Whether or not an exception occurs", "Never if try contains return"], a: 2, e: "finally runs in both cases, even when try returns." },
    { q: "Which keyword goes in a method header to declare an exception?", o: ["throw", "throws", "catch", "try"], a: 1, e: "throws declares; throw actually throws." },
    { q: "How should catch blocks be ordered?", o: ["Superclass exceptions first", "Subclass exceptions before superclass exceptions", "Any order", "Alphabetically"], a: 1, e: "A superclass catch first would make the subclass catch unreachable, which is a compile error." }
  ]

{
  id: "trace", num: "T", part: "extra",
  title: "Trace tables",
  blurb: "Run code by hand, one variable change at a time, to catch logic errors.",
  sections: [
    { h: "What a trace table is",
      p: ["A trace table has one column per variable, plus columns for conditions and output. Moving down the table is moving forward in time: each new row shows values after something changes.",
          "Tracing lets you test logic without a computer, which is exactly what exam questions ask you to do."] },
    { h: "Worked example: a while loop",
      code: String.raw`int x = 3;
int y = 1;

  y = y * 2;
  x = x - 1;
}
System.out.println(y);`,
      table: { head: ["Step", "x", "y", "x > 0", "Output"], rows: [["Start", "3", "1", "true", ""], ["After pass 1", "2", "2", "true", ""], ["After pass 2", "1", "4", "true", ""], ["After pass 3", "0", "8", "false", ""], ["After loop", "", "", "", "8"]] },
      p: ["The condition is checked before each pass. When it becomes false the loop ends and the print runs."] },
    { h: "Tracing for loops, nested loops, and searches",
      p: ["For a for loop, remember the order: initialise, check, run body, update, check again. When the loop ends, the counter holds the value that made the check false.",
          "In nested loops the inner counter restarts on every pass of the outer loop. In a linear search, add a column for the element being compared so you can see exactly when the key is found."] },
    { h: "Common mistakes and a shortcut",
      p: ["Frequent errors: updating variables out of order, forgetting the final check that ends the loop, off-by-one mistakes with [[<]] vs [[<=]], and not resetting inner loop counters.",

    { t: "code", sup: "guided", h: "Step 4: Java",
      code: String.raw`class InsufficientFundsException extends Exception {
    public InsufficientFundsException(double shortBy) {
        super("Short by " + shortBy);
    }
}

class Account {
    private double balance = 200;

    public void withdraw(double amount) throws InsufficientFundsException {
        if (amount > balance)
            throw new InsufficientFundsException(amount - balance);
        balance -= amount;
    }
}

    account.withdraw(500);
    System.out.println("Take your cash");
} catch (InsufficientFundsException ex) {
    System.out.println("Sorry: " + ex.getMessage());
} finally {
    System.out.println("Card ejected");
}`, p: ["throw sends an exception object; throws in the header warns callers."] },

    private String phoneNumber;

        this.phoneNumber = phoneNumber;

    public InsufficientFundsException(double shortfall) {
        super("Insufficient funds: short by " + shortfall);
    }

class Account {
    private double balance = 100;

    public void withdraw(double amount) throws InsufficientFundsException {
        if (amount > balance)
            throw new InsufficientFundsException(amount - balance);
        balance -= amount;
    }
}

public class Main {
    public static void main(String[] args) {
        Account acc = new Account();
        try {

        } catch (InsufficientFundsException e) {

        } finally {
            System.out.println("Thank you");
        }
    }
}` },
{ id: "b10", level: 5, title: "Robust score averages", sk: ["exceptions", "arrays"],
  req: "Write static int parseScore(String text) that uses Integer.parseInt and throws IllegalArgumentException if the score is below 0 or above 100. Write static double average(String[] scores) that skips any entry that fails (NumberFormatException or IllegalArgumentException) by catching inside the loop, and returns the average of the valid ones (0 if none).",
  starter: "public class Scores {\n\n}\n",
  checks: [["parseScore signature", String.raw`static\s+int\s+parseScore\s*\(\s*String\s+\w+\s*\)`, ""], ["Range check throws", String.raw`throw\s+new\s+IllegalArgumentException`, ""],
    ["average(String[])", String.raw`static\s+double\s+average\s*\(\s*String\s*\[\s*\]\s+\w+\s*\)`, ""],
    ["try-catch inside the loop", String.raw`for\s*\([^)]*\)\s*\{?\s*try\s*\{`, "Put try inside the loop so one bad value does not stop the rest."],
    ["Handles no valid scores", String.raw`==\s*0\s*\)?\s*\??\s*(return\s+0|0)|count\s*==\s*0|valid\s*==\s*0|n\s*==\s*0`, "Avoid dividing by zero."]],
  tests: [["Normal", "{\"80\", \"90\"}", "85.0"], ["Invalid input", "{\"80\", \"abc\", \"150\"}", "80.0"], ["No valid values", "{\"x\"}", "0.0, no exception"]],
  model: String.raw`public class Scores {
    static int parseScore(String text) {
        int score = Integer.parseInt(text.trim());
        if (score < 0 || score > 100)
            throw new IllegalArgumentException("Out of range: " + score);
        return score;
    }

    static double average(String[] scores) {
        int total = 0, count = 0;
        for (String s : scores) {
            try {
                total += parseScore(s);
                count++;
            } catch (IllegalArgumentException e) {
                // NumberFormatException is a subclass, so both are skipped
            }
        }
        return count == 0 ? 0 : (double) total / count;
    }
}` },

  model: String.raw`import java.util.ArrayList;

class SquadFullException extends Exception {
    public SquadFullException() { super("Squad is full"); }
}

abstract class Player {
    private String name;
    private int age;
    private double weightKg;

    public Player(String name, int age, double weightKg) {
        this.name = name;
        this.age = age;
        this.weightKg = weightKg;
    }

    public String getName() { return name; }

    public boolean isEligible() {
        return age >= 18 && age <= 35 && weightKg < 90;
    }

    public abstract double rating();
}

class Striker extends Player {
    private int goals;

    public Striker(String name, int age, double weightKg, int goals) {
        super(name, age, weightKg);
        this.goals = goals;
    }

    @Override
    public double rating() { return 5 + 0.4 * goals; }

    private int cleanSheets;

    public Goalkeeper(String name, int age, double weightKg, int cleanSheets) {
        super(name, age, weightKg);
        this.cleanSheets = cleanSheets;
    }

    @Override
    public double rating() { return 5 + 0.5 * cleanSheets; }
}

class Team {
    private ArrayList<Player> squad = new ArrayList<>();

    public void addPlayer(Player p) throws SquadFullException {
        if (squad.size() >= 25) throw new SquadFullException();
        squad.add(p);
    }

    public Player bestPlayer() {
        Player best = null;
        for (Player p : squad)

class RoomUnavailableException extends Exception {
    public RoomUnavailableException(String message) { super(message); }
}

class Room {
    private int number;
    private double rate;
    private boolean booked;

    public Room(int number, double rate) {
        this.number = number;
        this.rate = rate;
    }

    public int getNumber() { return number; }
    public boolean isBooked() { return booked; }
    public void markBooked() { booked = true; }

    public double priceFor(int nights) { return rate * nights; }
}

class SuiteRoom extends Room {
    public SuiteRoom(int number, double rate) { super(number, rate); }

    @Override
    public double priceFor(int nights) { return super.priceFor(nights) + 100; }
}

class Hotel {
    private ArrayList<Room> rooms = new ArrayList<>();

    public void addRoom(Room r) { rooms.add(r); }

        for (Room r : rooms) {

                return r.priceFor(nights);

ch5: {
  focus: "Loops are taught as a design skill: decide what repeats, what changes each time and when to stop. The book's sentinel-controlled and count-controlled patterns, plus its warning about using doubles as loop controls, are exactly what exam tracing questions test.",
  examples: [["RepeatAdditionQuiz", "keep asking until the answer is right"], ["SentinelValue", "stop reading when the user enters 0"], ["GreatestCommonDivisor", "search downwards for the GCD"], ["PredictTuition and futureValue examples", "a loop that models growth"], ["Dec2Hex and Hex2Dec", "repeated division and remainder"], ["MonteCarloSimulation", "estimate pi by counting random points"], ["PrimeNumber", "nested loops with a flag"]],

    { q: "What is printed?", code: "for (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 3; j++) {\n        if (j == 2) continue;\n        System.out.print(i * j + \" \");\n    }\n}", o: ["1 3 2 6 3 9", "1 2 3 2 4 6 3 6 9", "1 3 2 6", "Nothing"], a: 0, e: "continue skips only j == 2, so each outer pass prints i*1 and i*3." }

ch6: {
  focus: "Methods are presented as the first real design tool: give a job a name, hide the details, and reuse it. The book spends time on the call stack, on pass-by-value, and on stepwise refinement, where a large problem is broken into methods before any of them are written.",
  examples: [["max and min methods", "the first value-returning methods"], ["isPrime as a method", "reuse instead of repeating the test"], ["Hex2Dec and Dec2Hex methods", "converting with helper methods"], ["PrintCalendar", "the stepwise refinement case study built from getStartDay, getTotalNumberOfDays and printMonth"]],
  cautions: ["Every path through a value-returning method must return a value, or the code will not compile.", "Changing a parameter inside a method never changes the caller's variable, because Java passes a copy of the value.", "Two methods that differ only in return type do not compile; overloading needs different parameter lists."],
  checkpoints: [
    { q: "What does this print?", code: "public static int increase(int n) {\n    n++;\n    return n;\n}\n// in main\nint x = 5;\nincrease(x);\nSystem.out.println(x);", o: ["5", "6", "0", "Compile error"], a: 0, e: "The returned value was ignored, and the parameter was only a copy." },
    { q: "Why does the book recommend writing method stubs during stepwise refinement?", o: ["Stubs make the program faster", "They let you compile and test the overall structure before every detail exists", "Stubs are required by the compiler", "They replace comments"], a: 1, e: "Top-down development runs the skeleton early and fills in the bodies one at a time." },
    { q: "Which pair of methods is a valid overload?", o: ["[[int f(int a)]] and [[double f(int a)]]", "[[int f(int a)]] and [[int f(double a)]]", "[[int f(int a)]] and [[int f(int b)]]", "[[void f()]] and [[void f()]]"], a: 1, e: "The parameter types differ, so the compiler can tell the calls apart." }
  ],
  exercises: [
    { t: "isPalindrome method", d: "Medium", req: "Write [[public static boolean isPalindrome(String s)]] and a main that tests it with at least four strings.", plan: "Compare the characters at the two ends and move inwards, or build the reverse and compare." },
    { t: "Reusable conversion methods", d: "Medium", req: "Write celsiusToFahrenheit, fahrenheitToCelsius, footToMetre and metreToFoot, then print a two-column conversion table using them.", plan: "Four one-line methods, then two loops with printf. This is the book's “methods make tables easy” idea." },

ch9: {
  focus: "This is the pivot of the course. The book builds a class from a UML diagram, explains that a reference variable holds a reference rather than an object, and introduces constructors, instance versus static members, visibility modifiers, data-field encapsulation and immutability. Most exam questions on “what prints” for objects come from here.",
  examples: [["SimpleCircle and Circle", "the first class, then the same class with constructors and getters"], ["TV", "a class with state (channel, volume) and behaviour (channelUp, volumeDown)"], ["java.util.Date and java.util.Random", "using classes from the API before writing your own"], ["CircleWithPrivateDataFields", "adding private fields and accessor methods"], ["ImmutableCircle-style examples", "why a class with a setter is not immutable"]],
  cautions: ["If you write any constructor, Java no longer supplies the no-arg one.", "An object's data fields get defaults (0, false, null), but a local variable does not: using it before assigning is a compile error.", "A static method cannot use instance fields directly, because there is no object to read them from.", "A class is immutable only if all fields are private, there are no setters, and no method returns a reference to a mutable field."],
  checkpoints: [
    { q: "What does this print?", code: "class Count {\n    public int count;\n    public Count(int c) { count = c; }\n    public Count() { count = 1; }\n}\n// in main\nCount myCount = new Count(2);\nint times = 0;\nfor (int i = 0; i < 100; i++) {\n    increment(myCount, times);\n}\nSystem.out.println(myCount.count + \" \" + times);\n// static void increment(Count c, int times) { c.count++; times++; }", o: ["2 0", "102 0", "102 100", "2 100"], a: 1, e: "The object is shared, so count rises by 100 to 102, but times is a copy and stays 0. This is the book's classic pass-by-value example." },
    { q: "Which is true about a static variable?", o: ["Each object gets its own copy", "It is shared by all objects and can be used before any object exists", "It must be final", "It can only be read inside constructors"], a: 1, e: "Static members belong to the class, so Circle.numberOfObjects works with no object at all." },
    { q: "What does the default value of a reference data field mean in practice?", o: ["It is an empty object", "It is null, so calling a method on it throws NullPointerException", "It is 0", "The compiler refuses to run"], a: 1, e: "Reference fields start as null until you create an object for them." }
  ],
  exercises: [
    { t: "The Stock class", d: "Medium", req: "Write a Stock class with a symbol, a name, a previous closing price and a current price, plus a method that returns the percentage change. Test it with a stock that moves from 34.5 to 34.35.", plan: "Private fields, a constructor for symbol and name, setters for the prices, and getChangePercent() returning (current − previous) / previous. Expected answer: about −0.43%.", build: "b1" },
    { t: "The Fan class", d: "Medium", req: "Write a Fan class with constants SLOW, MEDIUM and FAST (1, 2, 3), a speed, an on/off flag, a radius and a colour, with a no-arg constructor giving a slow, off, white fan of radius 5, plus getters, setters and toString.", plan: "Use [[public static final int]] for the speeds. toString should describe the fan differently when it is off." },
    { t: "Count created objects", d: "Easy", req: "Add a static counter to any class of yours so that the class can report how many objects have been created.", plan: "A private static int incremented in every constructor, plus a public static getter." }
  ]

ch10: {
  focus: "Chapter 10 is about thinking, not new syntax: which class should own this data, what should be hidden, and when one class should contain another. Wrapper classes, BigInteger and BigDecimal, StringBuilder and regular expressions appear here as worked examples of good class design.",
  examples: [["Loan", "a class that hides the monthly-payment formula behind a method"], ["BMI", "a class that turns raw numbers into an interpretation"], ["Course", "a class that holds students in an array and grows it when it is full"], ["StackOfIntegers", "a class that stores data and controls how it is used"], ["LargeFactorial with BigInteger", "arithmetic that does not fit in a long"], ["PalindromeIgnoreNonAlphanumeric with StringBuilder", "building and reversing text efficiently"]],
  cautions: ["A getter that returns a reference to a private array or list breaks encapsulation: the caller can then change your data.", "Comparing wrapper objects with [[==]] compares references, not values; use [[equals]] or unbox first.", "Building a long string with [[+]] inside a loop creates a new object each time; use StringBuilder."],
  checkpoints: [
    { q: "Why does the book prefer [[Course.addStudent(...)]] over a public students array?", o: ["It is faster", "The class keeps control of its own data and can enforce rules", "Arrays cannot be public", "It saves memory"], a: 1, e: "Encapsulation means callers use methods, so the class decides what is allowed." },
    { q: "Which relationship describes “a Course has Students”?", o: ["Inheritance", "Aggregation", "Interface implementation", "Overloading"], a: 1, e: "A has-a relationship, drawn in UML with a hollow diamond at the owner." },
    { q: "What does this print?", code: "StringBuilder sb = new StringBuilder(\"Ghana\");\nString s = sb.reverse().toString();\nSystem.out.println(s + \" \" + sb.length());", o: ["anahG 5", "Ghana 5", "anahG 0", "Compile error"], a: 0, e: "reverse changes the StringBuilder in place and returns it; the length is unchanged." }
  ],
  exercises: [

    { t: "The MyPoint class", d: "Medium", req: "Write MyPoint with x and y, a no-arg constructor for (0, 0), a two-argument constructor, getters, a distance(MyPoint) method and a static distance(MyPoint, MyPoint) method.", plan: "Use Math.sqrt on the squared differences. Having both an instance and a static version shows the difference clearly." },
    { t: "Reformat a phone list", d: "Hard", req: "Read a line containing several phone numbers separated by commas and print each on its own line, rejecting any that do not match the pattern 0XX-XXX-XXXX.", plan: "split(\",\") then matches(\"0\\\\d{2}-\\\\d{3}-\\\\d{4}\") on each trimmed part." }
  ]

ch11: {
  focus: "Inheritance and polymorphism carry the most exam weight. The book develops a GeometricObject family, then shows constructor chaining, overriding versus overloading, the Object class, dynamic binding, casting with instanceof, and the ArrayList class. The MyStack example shows composition as an alternative to inheritance.",
  examples: [["GeometricObject with Circle and Rectangle", "the family used throughout the chapter"], ["Faculty, Employee and Person", "the constructor-chaining output example"], ["PolymorphismDemo and DynamicBindingDemo", "why the object, not the variable, chooses the method"], ["TestArrayList and DistinctNumbers", "ArrayList instead of a fixed array"], ["MyStack", "a stack built by holding an ArrayList rather than extending it"]],
  cautions: ["A subclass does not inherit constructors; it calls them with [[super(...)]], which must be the first statement.", "If the superclass has no no-arg constructor and the subclass does not call [[super(args)]], the class will not compile.", "Overriding needs the same signature: changing the parameter list creates an overload that is never called through the superclass type.", "Casting compiles whenever the types are related, but fails at run time with ClassCastException if the object is the wrong kind. Test with [[instanceof]] first.", "A private method is not overridden, and a static method is hidden rather than overridden."],
  checkpoints: [

    { q: "[[GeometricObject g = new Circle(2); System.out.println(g);]] where Circle overrides toString. Which version runs?", o: ["Object's", "GeometricObject's", "Circle's, because of dynamic binding", "It does not compile"], a: 2, e: "println calls toString on the actual object." },
    { q: "Which ArrayList call removes the first matching object rather than an index?", o: ["[[list.remove(0)]]", "[[list.remove(\"Ama\")]]", "[[list.delete(\"Ama\")]]", "[[list.clear()]]"], a: 1, e: "remove(Object) searches with equals; remove(int) removes by position. With an ArrayList<Integer> this difference is a classic trap." }
  ],
  exercises: [
    { t: "Triangle extends GeometricObject", d: "Medium", req: "Write a Triangle class with three sides that extends GeometricObject, overrides getArea (Heron's formula) and getPerimeter, and overrides toString.", plan: "s = (a+b+c)/2; area = sqrt(s(s−a)(s−b)(s−c)). Call super(color, filled) in the constructor.", build: "b6" },
    { t: "Account hierarchy", d: "Hard", req: "Write Account with a balance and an annual interest rate, then SavingsAccount (no overdraft) and CheckingAccount (an overdraft limit). Override withdraw so each type enforces its own rule, then process an array of accounts in one loop.", plan: "Put the shared data in Account and override only what differs. The loop should never test the type.", build: "b7" },
    { t: "Distinct numbers", d: "Medium", req: "Read integers until the user enters 0, then display the distinct values in the order entered, using an ArrayList.", plan: "list.contains(value) before list.add(value). Watch the Integer autoboxing when you remove by value." }

ch12: {
  focus: "The chapter's argument is that a method which detects a problem is rarely the method that should decide what to do about it. It covers the Throwable hierarchy, checked versus unchecked exceptions, declaring, throwing, catching, finally, custom exception classes, rethrowing, and then text file I/O with File, PrintWriter and Scanner, ending with a web crawler.",
  examples: [["Quotient examples", "the same division shown with a return code, then with an exception"], ["CircleWithException and InvalidRadiusException", "a custom checked exception for a class invariant"], ["TestFileClass and WriteData / ReadData", "File properties, then writing and reading a text file"], ["ReplaceText", "read a file, change it and write it back"], ["WebCrawler", "read pages from URLs and follow the links"]],
  cautions: ["Catching Exception first makes every later catch unreachable, which is a compile error. Order subclasses first.", "Do not use exceptions for ordinary expected situations; testing [[if (ref != null)]] is cheaper and clearer than catching NullPointerException.", "[[new PrintWriter(file)]] and [[new Scanner(file)]] throw checked exceptions, so the method must catch or declare them.", "A file left unclosed may lose data; try-with-resources closes it even when an exception is thrown."],
  checkpoints: [
    { q: "What does this print?", code: "try {\n    System.out.print(\"A\");\n    int[] x = new int[2];\n    x[2] = 1;\n    System.out.print(\"B\");\n} catch (RuntimeException e) {\n    System.out.print(\"C\");\n} finally {\n    System.out.print(\"D\");\n}\nSystem.out.print(\"E\");", o: ["ABDE", "ACDE", "ACD", "ACE"], a: 1, e: "B is skipped, the ArrayIndexOutOfBoundsException is a RuntimeException so C runs, then finally and the statement after the try." },
    { q: "Which class is the superclass of both Error and Exception?", o: ["Object", "Throwable", "RuntimeException", "Exception"], a: 1, e: "Throwable sits at the top; Error is for system problems you should not try to handle." },
    { q: "Your method calls one that declares [[throws IOException]]. What must your method do?", o: ["Nothing", "Catch it, or declare throws IOException itself", "Convert it to a RuntimeException", "Make itself static"], a: 1, e: "This is the catch-or-declare rule for checked exceptions." }
  ],
  exercises: [
    { t: "InvalidRadiusException", d: "Medium", req: "Write a checked InvalidRadiusException and a Circle whose setRadius throws it for a negative radius. In main, catch it and print the message.", plan: "The exception class extends Exception and passes a message to super; setRadius declares throws.", build: "b9" },
    { t: "Count words in a file", d: "Medium", req: "Read a text file given on the command line and display the number of words, lines and characters, handling a missing file cleanly.", plan: "Check file.exists() first, then use Scanner with hasNextLine. Wrap the file work in try-with-resources." },
    { t: "Occurrences of each letter", d: "Hard", req: "Read a file and display how many times each letter occurs, ignoring case and punctuation.", plan: "An int[26] of counters, Character.isLetter, and toLowerCase to fold the cases together." }

ch13: {
  focus: "Abstract classes and interfaces are where the book separates “what a family is” from “what a class can do”. It builds an abstract GeometricObject, shows the abstract Number and Calendar classes from the API, then Comparable, Cloneable and the Rational class as a full design example, ending with class-design guidelines.",
  examples: [["Abstract GeometricObject", "abstract getArea and getPerimeter implemented by each subclass"], ["Number and Calendar/GregorianCalendar", "abstract classes in the Java API"], ["ComparableRectangle and sorting objects", "implementing Comparable so Arrays.sort works"], ["House with Cloneable", "shallow versus deep copies"], ["Rational", "a complete immutable class with arithmetic, compareTo and toString"], ["Edible-style interfaces", "unrelated classes sharing a capability"]],
  cautions: ["You cannot create an object of an abstract class, but you can declare a variable of that type and you can still have constructors.", "A subclass that does not implement every abstract method must itself be abstract.", "All interface fields are [[public static final]], whether you write those words or not.", "Cloneable has no methods: it only signals that clone() is allowed. A default clone is shallow, so object fields are shared."],

    { q: "Why does Liang make Rational immutable?", o: ["To save memory", "So a rational number cannot change after it is created, which keeps arithmetic predictable", "Because interfaces require it", "So it can be abstract"], a: 1, e: "Its fields are private with no setters; every operation returns a new Rational." }

    { t: "Sort an array of objects", d: "Medium", req: "Make a Student class implement Comparable<Student> ordering by GPA, then sort an array with Arrays.sort and print the result.", plan: "Use Double.compare inside compareTo, and override toString so printing is readable." },

NOTES.ch1 = {
  intro: "This chapter answers three questions: what a computer actually does, why we need programming languages at all, and how a Java program gets from your text editor to a running process. Nothing here is hard, but the vocabulary (bytecode, JVM, JDK, compile error) is used for the rest of the course, so it is worth reading slowly once.",

          "Memory (RAM) holds the program and its data while the program runs. It is ordered, so each location has an address, and it is volatile: switch the power off and it is gone. That is why we also have storage devices (hard disks, SSDs, flash drives) which keep data permanently but are far slower to read."] },
    { h: "How data is stored: bits and bytes",
      p: ["Every piece of data in memory is stored as a sequence of 0s and 1s. One 0 or 1 is a bit, and eight bits make one byte. A byte is the smallest unit you normally talk about.",
          "A byte can hold 256 different patterns, which is enough to encode one ordinary character. So the character 'A' is stored as the number 65, which in binary is 01000001. Numbers, characters, images and sound are all stored the same way: what differs is how the program interprets the bits.",
          "Storage sizes follow the same idea: a kilobyte is about a thousand bytes, a megabyte about a million, a gigabyte about a billion, and a terabyte about a trillion."],

    { h: "Programs and programming languages",
      p: ["A program is a set of instructions that tells the computer what to do. The CPU only understands machine language: binary instructions such as 1101101010011010. Writing that by hand is impossible in practice, so assembly language was invented, which replaces the binary with short words like [[ADD]] and [[SUB]]. An assembler translates assembly into machine code.",
          "Assembly is still tied to one kind of CPU, so high-level languages came next. Java, Python, C, C++ and C# are high-level: one statement such as [[area = 5 * 5 * 3.14159;]] stands for many machine instructions, and the same statement works on any machine.",
          "A statement written in a high-level language is called source code, and it must be translated before the machine can run it. There are two ways to translate: an interpreter reads one statement, translates it and runs it, then moves to the next; a compiler translates the whole file into machine code first, and you run the result afterwards."] },

      code: String.raw`Welcome.java   --javac-->   Welcome.class   --java-->   output on screen
 (source code)              (bytecode)            (JVM executes it)`,

    { h: "The characteristics of Java",
      p: ["Your slides spend twelve slides on Java's characteristics, and exam questions often ask you to explain two or three of them. Learn them as short phrases with a reason."],

    { h: "Anatomy of a simple Java program",

          "[[public static void main(String[] args)]] is the main method, the point where the JVM starts execution. Every program you run directly needs exactly this header. [[System.out.println(...)]] prints its argument and then moves to a new line; [[print]] would stay on the same line.",

NOTES.ch3 = {
  intro: "Selections let a program choose. The Java part is small: boolean values, [[if]], [[switch]] and the conditional operator. The difficulty is in building the right condition and in reading nested statements correctly, which is exactly what exam tracing questions test.",
  sections: [
    { h: "The boolean type and relational operators",
      p: ["A [[boolean]] variable holds only [[true]] or [[false]]. The six relational operators produce boolean values: [[<]], [[<=]], [[>]], [[>=]], [[==]] (equal to) and [[!=]] (not equal to).",
          "Note that Java uses [[==]] for comparison because [[=]] already means assignment. Writing [[if (x = 5)]] where x is an int is a compile error, because an int is not a boolean; with booleans it compiles and silently assigns, which is worse."],
      code: String.raw`boolean isEven = (number % 2 == 0);
System.out.println("Is it even? " + isEven);` },
    { h: "One-way and two-way if statements",
      code: String.raw`// one-way
if (radius >= 0) {
    area = radius * radius * PI;
    System.out.println("Area is " + area);
}

// two-way
if (radius >= 0) {
    System.out.println("Area is " + radius * radius * PI);
} else {
    System.out.println("Negative input");
}`,
      p: ["The braces are optional when the body is a single statement, but leaving them out is how bugs get in. Liang's advice, and mine, is to always use braces."],
      caution: "A semicolon straight after the condition ends the statement: [[if (x > 0);]] followed by a block means the block always runs. The compiler says nothing, so this is a logic error." },
    { h: "Multi-way if-else",
      p: ["When several ranges are possible, chain the tests. Only the first true branch runs, so order matters: test the most restrictive condition first."],
      code: String.raw`if (score >= 90.0)
    grade = 'A';
else if (score >= 80.0)
    grade = 'B';
else if (score >= 70.0)
    grade = 'C';
else if (score >= 60.0)
    grade = 'D';
else
    grade = 'F';`,
      note: "Write the same chain in the wrong order (for example [[score >= 60]] first) and every passing student gets a D. When tracing, put the test value into each condition in turn and stop at the first true one." },
    { h: "Logical operators and truth tables",
      p: ["Four operators combine boolean values: [[!]] (not), [[&&]] (and), [[||]] (or) and [[^]] (exclusive or, true when exactly one side is true).",
          "[[&&]] and [[||]] are short-circuit: if the left side already decides the answer, the right side is never evaluated. That is what makes [[(x != 0) && (100 / x > 2)]] safe. The non-short-circuit versions [[&]] and [[|]] always evaluate both sides, which your slides mention mainly so you recognise them."],
      table: { head: ["p", "q", "p && q", "p || q", "p ^ q", "!p"], rows: [["true", "true", "true", "true", "false", "false"], ["true", "false", "false", "true", "true", "false"], ["false", "true", "false", "true", "true", "true"], ["false", "false", "false", "false", "false", "true"]] },
      code: String.raw`// Leap year: divisible by 4 but not by 100, unless divisible by 400
boolean isLeapYear = (year % 4 == 0 && year % 100 != 0) || (year % 400 == 0);` },
    { h: "Generating random numbers",
      p: ["[[Math.random()]] returns a double from 0.0 up to, but not including, 1.0. To get a whole number in a range, multiply and cast."],
      code: String.raw`int number1 = (int) (Math.random() * 10);        // 0 to 9
int dice = (int) (Math.random() * 6) + 1;       // 1 to 6
// general form: (int) (Math.random() * (max - min + 1)) + min` },
    { h: "switch statements",
      p: ["A switch chooses between many fixed values of one expression. The rules from your slides: the selector must be a char, byte, short, int, String or enum; each case label must be a constant of that type; [[break]] is optional but leaving it out makes execution fall through into the next case; and [[default]] is optional but recommended."],
      code: String.raw`switch (status) {
    case 0:
        compute taxes for single filers;
        break;
    case 1:
        compute taxes for married jointly;
        break;
    case 2:
    case 3:                       // deliberate fall-through: same action
        compute taxes for head of household;
        break;
    default:
        System.out.println("Invalid status");
}`,
      note: "Deliberate fall-through, as in grouping case 2 and case 3, is legitimate and appears in your Lab 1 jersey-number switch. Accidental fall-through is a logic error." },
    { h: "JDK 14 arrow switch and switch expressions",
      p: ["Newer Java offers a safer form. With [[->]] there is no fall-through, so no [[break]] is needed, and a switch can be used as an expression that produces a value. Inside a block, [[yield]] supplies that value."],
      code: String.raw`// arrow form as a statement
switch (day) {
    case 1, 7 -> System.out.println("Weekend");
    case 2, 3, 4, 5, 6 -> System.out.println("Weekday");
    default -> System.out.println("Invalid day");
}

// arrow form as an expression
String type = switch (day) {
    case 1, 7 -> "Weekend";
    case 2, 3, 4, 5, 6 -> "Weekday";
    default -> {
        yield "Invalid";
    }
};` },
    { h: "The conditional (ternary) operator",
      code: String.raw`int max = (num1 > num2) ? num1 : num2;
System.out.println((count % 10 == 0) ? count + "\n" : count + " ");`,
      p: ["Read it as: condition ? value if true : value if false. It is an expression, so it produces a value and can be used inside a larger expression or a println. Use it for a simple two-way choice, not for nested logic."] },
    { h: "Operator precedence and associativity",
      p: ["From highest to lowest, the groups you need in this chapter are: brackets; unary operators ([[!]], unary [[-]], [[++]], [[--]], casts); [[* / %]]; [[+ -]]; relational [[< <= > >=]]; equality [[== !=]]; [[^]]; [[&&]]; [[||]]; then assignment operators.",
          "Operators of the same precedence are applied left to right, except assignment, which is right to left. If a condition is long enough that you have to think about it, add brackets."] },
    { h: "Debugging logic errors",
      p: ["Your slides end with the three techniques: hand-trace the code on paper with a table of variables, insert print statements to see the values, or use the IDE's debugger to set a breakpoint and step through line by line while watching the variables. Tracing is the one you can use in an exam."] }
  ],
  summary: {
    points: ["[[==]] compares; [[=]] assigns.",
      "In a multi-way if-else only the first true branch runs; order the conditions carefully.",
      "[[&&]] and [[||]] short-circuit; [[&]] and [[|]] do not.",
      "[[^]] is true when exactly one operand is true.",
      "Classic switch falls through without [[break]]; the JDK 14 arrow form does not.",
      "[[Math.random()]] gives 0.0 ≤ value < 1.0.",
      "Ternary: [[condition ? valueIfTrue : valueIfFalse]]."],
    syntax: [["Multi-way", "if (c1) { }\nelse if (c2) { }\nelse { }"], ["Switch", "switch (x) {\n    case 1: ... break;\n    default: ...\n}"], ["Arrow switch expression", "String s = switch (x) {\n    case 1 -> \"one\";\n    default -> \"other\";\n};"], ["Random in a range", "(int) (Math.random() * (max - min + 1)) + min"]],
    traps: ["[[if (x > 0);]] — the semicolon makes the block unconditional.", "Missing [[break]] causing unintended fall-through.", "Testing the loosest condition first in an if-else chain.", "Using [[==]] to compare Strings instead of [[equals]]."],
    exam: ["Trace an if-else chain for several input values.", "Complete a truth table for [[&&]], [[||]] or [[^]].", "Rewrite an if-else as a switch, or a switch as an if-else.", "Write a boolean expression for a rule stated in English (leap year, eligibility, a prize condition)."]
  }
};

NOTES.ch4 = {
  intro: "This chapter gives you the standard toolbox: the Math class, the char type and the String class. Strings are objects, so this is also your first meeting with method calls on an object and with the difference between [[==]] and [[equals]] — the single most common source of silent bugs in beginner Java.",
  sections: [
    { h: "The Math class",
      p: ["Math is a class of static methods and two constants, [[Math.PI]] and [[Math.E]]. You never create a Math object; you call the methods on the class itself.",
          "The methods fall into groups: trigonometric ([[sin]], [[cos]], [[tan]], [[asin]], [[toRadians]], [[toDegrees]]), exponent ([[pow]], [[sqrt]], [[exp]], [[log]], [[log10]]), rounding ([[ceil]], [[floor]], [[rint]], [[round]]) and the small ones ([[min]], [[max]], [[abs]], [[random]])."],
      table: { head: ["Call", "Result", "Note"], rows: [["[[Math.sqrt(16)]]", "4.0", "always a double"], ["[[Math.pow(2, 10)]]", "1024.0", "the exponent operator Java lacks"], ["[[Math.ceil(2.1)]]", "3.0", "rounds up, returns double"], ["[[Math.floor(2.9)]]", "2.0", "rounds down, returns double"], ["[[Math.rint(2.5)]]", "2.0", "to the nearest even when exactly halfway"], ["[[Math.round(2.5)]]", "3", "returns long for a double argument"], ["[[Math.round(-2.5)]]", "-2", "half rounds up, so towards zero here"], ["[[Math.abs(-7)]]", "7", "same type as the argument"]] },
      caution: "Trigonometric methods work in radians, not degrees. Convert first with [[Math.toRadians(90)]]." },
    { h: "The char type and Unicode",
      p: ["A [[char]] holds exactly one character, written in single quotes: [[char letter = 'A';]]. Internally it is a number, using Unicode, which extends the older ASCII set. 'A' is 65, 'a' is 97 and '0' is 48.",
          "Because a char is a number, you can do arithmetic with it, and you can cast between char and the integer types."],
      code: String.raw`char a = 'A';
int code = a;               // 65, implicit widening
char next = (char) (a + 1); // 'B'
System.out.println(a + 1);  // 66  (int arithmetic, not "A1")
System.out.println((char) 66);  // B

// Escape sequences
System.out.println("Name\tAge");     // \t tab
System.out.println("Line1\nLine2");  // \n new line
System.out.println("She said \"hi\"");  // \" quote
System.out.println("C:\\temp");       // \\ backslash` },
    { h: "Testing and converting characters",
      p: ["The Character class has static methods for the tests you need: [[isDigit]], [[isLetter]], [[isLetterOrDigit]], [[isLowerCase]], [[isUpperCase]], plus [[toLowerCase]] and [[toUpperCase]].",
          "Characters compare with the relational operators using their Unicode values, so [['a' < 'b']] is true and [['A' < 'a']] is also true."],
      code: String.raw`char ch = input.next().charAt(0);
if (Character.isDigit(ch))
    System.out.println(ch + " is a digit");
else if (Character.isLetter(ch))
    System.out.println(Character.toUpperCase(ch) + " is a letter");` },
    { h: "Strings are objects",
      p: ["[[String]] is a class, not a primitive type, so a String variable holds a reference to an object. You create one with a literal ([[String s = \"Java\";]]) and call methods on it with a dot.",
          "Strings are immutable: every method that appears to change a string actually returns a new one."],
      table: { head: ["Method", "Returns", "Example"], rows: [["[[length()]]", "number of characters", "[[\"Welcome\".length()]] is 7"], ["[[charAt(i)]]", "the character at index i", "[[\"Welcome\".charAt(0)]] is 'W'"], ["[[concat(s)]]", "a joined string", "same as [[+]]"], ["[[toUpperCase()]] / [[toLowerCase()]]", "a new string", "the original is unchanged"], ["[[trim()]]", "a copy without outer spaces", "useful after reading input"], ["[[substring(b)]] / [[substring(b, e)]]", "part of the string", "the end index is excluded"], ["[[indexOf(x)]] / [[lastIndexOf(x)]]", "position or −1", "search for a char or string"], ["[[equals(s)]] / [[equalsIgnoreCase(s)]]", "boolean", "compares contents"], ["[[compareTo(s)]]", "negative, 0 or positive", "dictionary order"], ["[[startsWith]] / [[endsWith]] / [[contains]]", "boolean", "pattern checks"]] },
      code: String.raw`String message = "Welcome to Java";
System.out.println(message.length());              // 15
System.out.println(message.charAt(0));             // W
System.out.println(message.substring(0, 7));       // Welcome
System.out.println(message.indexOf("Java"));       // 11
System.out.println(message.toUpperCase());         // WELCOME TO JAVA
System.out.println(message);                       // unchanged` },
    { h: "Comparing strings: the big trap",
      p: ["[[==]] on two String variables asks whether they refer to the same object, not whether they contain the same characters. Identical literals are shared (interned), so [[\"Java\" == \"Java\"]] happens to be true, but a string built at run time, for example one read with Scanner, is a different object and [[==]] is false.",
          "Always use [[equals]] for contents, and [[compareTo]] when you need an order."],

String s2 = "Java";
String s3 = new String("Java");

"apple".compareTo("banana");  // negative: apple comes first

    { h: "Reading strings and characters from the console",

      code: String.raw`System.out.printf("%-10s%8.2f%n", "Total", 45.678);

    { h: "Text blocks (Java 15)",

    exam: ["State the output of fragments mixing char arithmetic and casts.", "Give the result of several String method calls on one string.", "Explain why [[==]] can be true for literals but false for [[new String]].", "Write a printf statement to produce a stated layout."]

NOTES.ch5 = {
  intro: "A loop repeats a block while a condition holds. Your slides open with the problem of printing “Welcome to Java” a hundred times and then show the three loop forms. The syntax takes ten minutes to learn; the skill is deciding what changes each pass and when to stop, and being able to trace a loop by hand.",
  sections: [
    { h: "The while loop",
      p: ["A while loop tests before each pass, so the body may run zero times. Three things must be present: something that initialises the control variable, a condition, and something inside the body that moves towards making the condition false."],
      code: String.raw`int count = 0;
while (count < 100) {
    System.out.println("Welcome to Java!");
    count++;              // without this, the loop never ends
}`,
      table: { head: ["Pass", "count before", "count < 100", "Action"], rows: [["1", "0", "true", "print, count becomes 1"], ["2", "1", "true", "print, count becomes 2"], ["…", "…", "…", "…"], ["100", "99", "true", "print, count becomes 100"], ["exit", "100", "false", "loop ends"]] },
      caution: "An infinite loop usually means you forgot to update the control variable, or you updated the wrong one. A semicolon after the header, [[while (i < 10);]], gives an empty body and also loops forever." },
    { h: "Sentinel-controlled loops",
      p: ["When you do not know how many values will be entered, you keep reading until a special value, the sentinel, arrives. The order matters: read one value before the loop, then read the next value at the end of the body."],
      code: String.raw`Scanner input = new Scanner(System.in);
int data = input.nextInt();        // read the first value
int sum = 0;

while (data != 0) {                // 0 is the sentinel
    sum += data;
    data = input.nextInt();        // read the next value
}
System.out.println("The sum is " + sum);`,
      note: "Do not use a floating-point value as a sentinel or as a loop condition: [[data != 0.0]] can fail because of round-off." },
    { h: "The do-while loop",
      p: ["A do-while tests after the body, so the body always runs at least once. It fits menus and input validation, where you must ask before you can check."],
      code: String.raw`int data;
do {
    System.out.print("Enter a positive number: ");
    data = input.nextInt();
} while (data <= 0);      // note the semicolon after the condition` },
    { h: "The for loop",
      p: ["A for loop gathers the initial action, the condition and the update into one header, which is why it suits counting.",
          "The order of execution is: initial action once; then test; if true run the body; then update; then test again."],
      code: String.raw`for (int i = 0; i < 100; i++) {
    System.out.println("Welcome to Java!");
}

// equivalent while loop
int i = 0;
while (i < 100) {
    System.out.println("Welcome to Java!");
    i++;
}`,
      note: "A variable declared in the header exists only inside the loop. After [[for (int i = 0; i < 3; i++)]] finishes, i has the value that failed the test (3) — but you cannot read it outside, because it is out of scope." },
    { h: "Which loop to use",
      p: ["The three forms are equally powerful; choose for readability. Use a for loop when the number of repetitions is known or countable. Use a while loop when repetition depends on a condition, such as reading until a sentinel. Use a do-while when the body must run at least once."],
      caution: "Two errors worth memorising: an extra semicolon after the header of a for or while loop creates an empty body, and using [[<=]] where you meant [[<]] runs the loop one extra time (the off-by-one error)." },
    { h: "Nested loops",
      p: ["A loop inside a loop. The inner loop runs completely for every single pass of the outer loop, and the inner control variable restarts each time. For a multiplication table, the outer loop is the row and the inner loop is the column."],
      code: String.raw`for (int row = 1; row <= 9; row++) {
    for (int col = 1; col <= 9; col++) {
        System.out.printf("%4d", row * col);
    }
    System.out.println();          // new line after each row
}` },
    { h: "Minimising numerical errors",
      p: ["Adding many small doubles accumulates error. Your slides show summing 0.01 + 0.02 + … + 1.0 and note that adding from the smallest number upwards is more accurate than adding from the largest downwards. The practical rules: control loops with integers, and do not test doubles for equality."] },
    { h: "Case studies in your slides",
      p: ["Greatest common divisor: start a candidate at the smaller number (or at 1) and search for the largest value that divides both.",
          "Future tuition: multiply by a growth factor once per year inside a loop until the total passes a target, counting the years.",
          "Decimal to hexadecimal: repeatedly take [[decimal % 16]] to get a digit and [[decimal / 16]] to shrink the number, building the result from right to left.",
          "Monte Carlo simulation: generate random points in a square, count how many fall inside the inscribed circle, and estimate π as 4 × (inside / total).",
          "Checking a palindrome: compare the characters at the two ends and move inwards while the low index is less than the high index.",
          "Prime numbers: for each candidate, test divisors up to its square root and use a boolean flag to record whether a divisor was found."],
      code: String.raw`// Decimal to hexadecimal
String hex = "";
while (decimal != 0) {
    int hexValue = decimal % 16;
    char hexDigit = (0 <= hexValue && hexValue <= 9)
        ? (char) (hexValue + '0')
        : (char) (hexValue - 10 + 'A');
    hex = hexDigit + hex;        // build from right to left
    decimal = decimal / 16;
}` },
    { h: "break and continue",
      p: ["[[break]] leaves the innermost loop immediately. [[continue]] skips the rest of the current pass and jumps to the update (in a for loop) or the condition (in a while loop).",
          "Both are useful but easy to abuse. In a while loop, be careful that [[continue]] does not skip the statement that updates the control variable, or you get an infinite loop."],
      code: String.raw`int sum = 0, number = 0;
while (number < 20) {
    number++;
    if (number == 10 || number == 11) continue;   // skip these two
    sum += number;
    if (sum > 100) break;                          // stop early
}` }
  ],
  summary: {
    points: ["while tests before (may run zero times); do-while tests after (runs at least once); for is for counting.",
      "Three parts of every loop: initialise, test, update.",
      "Sentinel loops read once before the loop and again at the end of the body.",
      "Nested loops: the inner loop restarts on every outer pass.",
      "break exits the loop; continue skips to the next pass.",
      "Never control a loop with a double, and never compare doubles with [[==]]."],
    syntax: [["while", "while (condition) {\n    // body\n}"], ["do-while", "do {\n    // body\n} while (condition);"], ["for", "for (int i = 0; i < n; i++) {\n    // body\n}"], ["Nested", "for (int r = 1; r <= 9; r++) {\n    for (int c = 1; c <= 9; c++) { }\n    System.out.println();\n}"]],
    traps: ["[[for (int i = 0; i < n; i++);]] — semicolon creates an empty body.", "Off-by-one from [[<=]] versus [[<]].", "Forgetting to update the control variable (infinite loop).", "[[continue]] in a while loop skipping the update."],
